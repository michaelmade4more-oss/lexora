<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#09090b">
<title>Lexora: Progress</title>
<style>
:root{
  --bg:#09090b;
  --surface:#121216;
  --surface2:#17171c;
  --line:#25242a;
  --text:#f1eee7;
  --muted:#9a98a0;
  --faint:#626067;
  --gold:#c9a24c;
  --gold2:#a9874e;
  --gold-pale:#e8d9b5;
  --green:#2e8b75;
  --green-deep:#1f5c4e;
  --green-pale:#7fd6b8;
  --shadow-card:0 24px 50px -28px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.03);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100dvh;overflow-x:hidden}
button{font:inherit;cursor:pointer;touch-action:manipulation;background:none;border:0;color:inherit}
#app{min-height:100dvh;max-width:480px;margin:auto;background:var(--bg);display:flex;flex-direction:column;position:relative}
main{flex:1}

.ambient{position:absolute;top:0;left:0;right:0;height:280px;
  background:radial-gradient(circle at 70% 0%,rgba(201,162,76,.14),transparent 60%);pointer-events:none}

.header{position:relative;padding:22px 20px 4px}
.hTitle{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0}
.hSub{margin-top:6px;color:var(--muted);font-size:14.5px;line-height:1.4}

.statGrid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:20px 20px 0;
  animation:riseIn .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.statCard{background:var(--surface2);border:1px solid var(--line);border-radius:18px;padding:18px 16px;
  box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:10px}

.rowTop{display:flex;align-items:center;justify-content:space-between}
.bigNum{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.statLabel{font-size:12px;color:var(--faint);font-weight:600}
.trendChip{font-size:10px;font-weight:700;padding:3px 7px;border-radius:100px;background:rgba(46,139,117,.16);color:var(--green-pale)}

.miniRing{width:34px;height:34px;border-radius:50%;padding:3px;flex:0 0 34px}
.miniRingInner{width:100%;height:100%;border-radius:50%;background:var(--surface2);display:grid;place-items:center;
  font-size:8.5px;font-weight:800}

.flameWrap{width:34px;height:34px;border-radius:50%;background:rgba(201,162,76,.14);display:grid;place-items:center;flex:0 0 34px}
.flameWrap svg{width:17px;height:17px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  animation:flicker 2.2s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.08) translateY(-1px)}}

.gaugeWrap{width:34px;height:34px;border-radius:50%;padding:3px;flex:0 0 34px}
.gaugeInner{width:100%;height:100%;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.gaugeInner svg{width:15px;height:15px;stroke:var(--green-pale);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.weekZone{position:relative;padding:26px 20px calc(20px + env(safe-area-inset-bottom));
  animation:riseIn .5s cubic-bezier(.2,.7,.2,1) .1s both}
.weekLabel{color:var(--faint);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 2px 12px}

.weekCard{background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:20px 18px 18px;box-shadow:var(--shadow-card)}
.weekTop{display:flex;align-items:baseline;justify-content:space-between}
.weekTitle{font-size:15px;font-weight:700;letter-spacing:-.01em}
.weekCount{font-size:15px;font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums}

.barChart{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:86px;margin-top:20px}
.barCol{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.barTrack{width:100%;max-width:22px;height:100%;border-radius:8px;background:var(--line);position:relative;overflow:hidden;display:flex;align-items:flex-end}
.barFill{width:100%;border-radius:8px;background:linear-gradient(180deg,var(--gold),var(--gold2));height:0;
  transition:height 1s cubic-bezier(.16,1,.3,1)}
.barFill.today{background:linear-gradient(180deg,var(--gold-pale),var(--gold))}
.barFill.empty{background:transparent}
.barDayLabel{font-size:9.5px;color:var(--faint);font-weight:600}
.barCol.today .barDayLabel{color:var(--gold);font-weight:700}

.navBar{position:sticky;bottom:0;display:flex;border-top:1px solid var(--line);
  background:rgba(9,9,11,.92);backdrop-filter:blur(14px);padding:10px 6px calc(10px + env(safe-area-inset-bottom))}
.navItem{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);
  font-size:10.5px;font-weight:600;padding:4px 0;transition:transform .12s}
.navItem:active{transform:scale(.92)}
.navItem svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navItem.active{color:var(--gold)}

@media(prefers-reduced-motion:reduce){
  .statGrid,.weekZone,.flameWrap svg,.barFill{animation:none;transition:none}
}
</style>
</head>
<body>
<div id="app">
  <div class="ambient"></div>

  <div class="header">
    <h1 class="hTitle">Progress</h1>
    <p class="hSub">Your learning activity at a glance.</p>
  </div>

  <div class="statGrid">
    <div class="statCard">
      <div class="rowTop">
        <span class="bigNum" data-count="142">0</span>
        <span class="trendChip">+12 wk</span>
      </div>
      <span class="statLabel">Words learned</span>
    </div>

    <div class="statCard">
      <div class="rowTop">
        <span class="bigNum" data-count="97">0</span>
        <span class="miniRing" id="masteredRing">
          <span class="miniRingInner" id="masteredRingText" style="color:var(--gold-pale)">0%</span>
        </span>
      </div>
      <span class="statLabel">Words mastered</span>
    </div>

    <div class="statCard">
      <div class="rowTop">
        <span class="bigNum" data-count="3">0</span>
        <span class="flameWrap"><svg viewBox="0 0 24 24"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-2-1-3-1-3 2 1 3 3 3 5a5 5 0 0 1-10 0c0-6 5-6 5-11z"/></svg></span>
      </div>
      <span class="statLabel">Current streak</span>
    </div>

    <div class="statCard">
      <div class="rowTop">
        <span class="bigNum" id="pronText">0%</span>
        <span class="gaugeWrap" id="pronRing">
          <span class="gaugeInner"><svg viewBox="0 0 24 24"><path d="M6 3a9 9 0 0 1 8 13.5"/><path d="M12 21l-3-3 3-3"/></svg></span>
        </span>
      </div>
      <span class="statLabel">Pronunciation</span>
    </div>
  </div>

  <main class="weekZone">
    <div class="weekLabel">Weekly consistency</div>
    <div class="weekCard">
      <div class="weekTop">
        <span class="weekTitle">Lessons completed</span>
        <span class="weekCount">5 / 6</span>
      </div>
      <div class="barChart" id="barChart"></div>
    </div>
  </main>

  <nav class="navBar">
    <button class="navItem"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</button>
    <button class="navItem"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Learn</button>
    <button class="navItem"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 12V6"/><path d="M3 12h6"/></svg>Review</button>
    <button class="navItem active"><svg viewBox="0 0 24 24"><path d="M5 20V11"/><path d="M12 20V4"/><path d="M19 20v-7"/></svg>Progress</button>
    <button class="navItem"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Profile</button>
  </nav>
</div>

<script>
function countUp(el, target, suffix, duration){
  suffix = suffix || '';
  duration = duration || 900;
  var start = null;
  function step(ts){
    if(!start) start = ts;
    var progress = Math.min((ts - start) / duration, 1);
    var eased = 1 - Math.pow(1 - progress, 3);
    el.textContent = Math.round(eased * target) + suffix;
    if(progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

document.querySelectorAll('[data-count]').forEach(function(el){
  countUp(el, parseInt(el.getAttribute('data-count'), 10), '', 900);
});

// mastered ring: 97 of 142 learned
var masteredPct = Math.round(97/142*100);
var ring = document.getElementById('masteredRing');
var ringText = document.getElementById('masteredRingText');
var deg = Math.round(masteredPct/100*360);
ring.style.background = 'conic-gradient(var(--gold) 0deg ' + deg + 'deg, var(--line) ' + deg + 'deg 360deg)';
countUp(ringText, masteredPct, '%', 900);

// pronunciation gauge
var pronRing = document.getElementById('pronRing');
var pronText = document.getElementById('pronText');
var pDeg = Math.round(91/100*360);
pronRing.style.background = 'conic-gradient(var(--green) 0deg ' + pDeg + 'deg, var(--line) ' + pDeg + 'deg 360deg)';
countUp(pronText, 91, '%', 900);

// weekly bars — computed from the real current date (Lagos time), not hardcoded
var dayLabels = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var now = new Date();
var todayIndex = parseInt(new Intl.DateTimeFormat('en-US', {timeZone:'Africa/Lagos', weekday:'numeric'}).format(now), 10) % 7;
// Placeholder completion data — replace with real per-day completion history from the backend.
// Only days up to and including today can be marked complete; future days always show empty.
var completedDemo = [1,1,1,1,1,0,0]; // Sun..Sat placeholder, to be replaced by real data
var days = dayLabels.map(function(label, i){
  return {d:label, v: i <= todayIndex ? completedDemo[i] : 0, today: i === todayIndex};
});
var chart = document.getElementById('barChart');
days.forEach(function(day, i){
  var col = document.createElement('div');
  col.className = 'barCol' + (day.today ? ' today' : '');
  var track = document.createElement('div');
  track.className = 'barTrack';
  var fill = document.createElement('div');
  fill.className = 'barFill' + (day.today ? ' today' : '') + (day.v === 0 ? ' empty' : '');
  track.appendChild(fill);
  var label = document.createElement('span');
  label.className = 'barDayLabel';
  label.textContent = day.d;
  col.appendChild(track);
  col.appendChild(label);
  chart.appendChild(col);

  setTimeout(function(){
    fill.style.height = (day.v === 0 ? 6 : 100) + '%';
  }, 120 + i * 70);
});

document.querySelectorAll(".navItem").forEach(function(btn){
  var routes = {Home:"home.html", Learn:"learn.html", Review:"review.html", Progress:"progress.html", Profile:"profile.html"};
  var label = btn.textContent.trim();
  if(routes[label]){
    btn.addEventListener("click", function(){ window.location.href = routes[label]; });
  }
});
</script>
</body>
</html>
