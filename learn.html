<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#09090b">
<title>Lexora: Learn</title>
<style>
:root{
  --bg:#09090b;
  --surface:#121216;
  --surface2:#17171c;
  --line:#25242a;
  --text:#f1eee7;
  --muted:#9a98a0;
  --faint:#626067;
  --gold:#c9a24c;
  --gold2:#a9874e;
  --gold-pale:#e8d9b5;
  --green:#2e8b75;
  --green-deep:#1f5c4e;
  --danger:#e06b76;
  --shadow-card:0 24px 50px -28px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.03);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100dvh;overflow-x:hidden}
button{font:inherit;cursor:pointer;touch-action:manipulation;background:none;border:0;color:inherit}
input{font:inherit;color:inherit}
#app{min-height:100dvh;max-width:480px;margin:auto;background:var(--bg);display:flex;flex-direction:column}

.learnMain{flex:1;padding:22px 20px 8px}

.learnTitle{font-size:34px;line-height:1.05;font-weight:750;letter-spacing:-.02em;
  animation:riseIn .5s cubic-bezier(.2,.7,.2,1) both}
.learnSub{color:var(--muted);font-size:15px;line-height:1.4;margin:8px 0 0;
  animation:riseIn .5s cubic-bezier(.2,.7,.2,1) .04s both}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.searchWrap{position:relative;margin-top:20px;animation:riseIn .5s cubic-bezier(.2,.7,.2,1) .08s both}
.searchWrap svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:18px;height:18px;
  stroke:var(--faint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;
  transition:stroke .15s}
.searchWrap:focus-within svg{stroke:var(--gold)}
.searchInput{width:100%;min-height:54px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);
  color:var(--text);padding:0 16px 0 48px;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
.searchInput::placeholder{color:var(--faint)}
.searchInput:focus{border-color:rgba(201,162,76,.55);box-shadow:0 0 0 3px rgba(201,162,76,.12)}
.clearBtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;
  border-radius:50%;display:none;align-items:center;justify-content:center;color:var(--faint)}
.clearBtn.show{display:flex}
.clearBtn:active{background:var(--surface)}
.clearBtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

.chipRow{display:flex;gap:8px;margin-top:16px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;
  animation:riseIn .5s cubic-bezier(.2,.7,.2,1) .1s both}
.chipRow::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 15px;border-radius:100px;font-size:13px;font-weight:650;white-space:nowrap;
  background:var(--surface2);border:1px solid var(--line);color:var(--muted);transition:transform .12s,border-color .15s,background .15s,color .15s}
.chip:active{transform:scale(.96)}
.chip.active{background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:transparent;color:#1a1408}

.resultsRow{display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding:0 2px}
.resultsCount{font-size:12.5px;color:var(--faint);font-weight:600}

.group{margin-top:10px;background:var(--surface2);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:var(--shadow-card);animation:riseIn .5s cubic-bezier(.2,.7,.2,1) .14s both}
.wordRow{width:100%;min-height:66px;display:flex;align-items:center;gap:13px;padding:15px 14px 15px 18px;text-align:left}
.wordRow+.wordRow{border-top:1px solid var(--line)}
.wordRow:active{background:var(--surface)}

.wordText{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
.wordTitle{font-size:17px;line-height:1.2;font-weight:650;letter-spacing:-.01em;color:var(--text)}
.wordMetaRow{display:flex;align-items:center;gap:7px;min-width:0}
.posPill{flex:0 0 auto;font-size:10.5px;font-weight:650;color:var(--muted);background:var(--surface);
  border:1px solid var(--line);border-radius:100px;padding:2.5px 8px}
.wordCat{font-size:12px;color:var(--gold);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.speakBtn{flex:0 0 34px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  color:var(--faint);transition:color .15s,background .15s,transform .12s}
.speakBtn:active{transform:scale(.9);background:var(--surface);color:var(--gold)}
.speakBtn.playing{color:var(--gold)}
.speakBtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.wordChevron{flex:0 0 auto;color:var(--faint);font-size:20px;line-height:1}

.emptyState{margin-top:34px;text-align:center;padding:0 20px;display:none}
.emptyState.show{display:block}
.emptyIconWrap{width:60px;height:60px;border-radius:16px;margin:0 auto 16px;
  background:linear-gradient(155deg,rgba(201,162,76,.16),rgba(201,162,76,.05));
  border:1px solid rgba(201,162,76,.2);display:grid;place-items:center}
.emptyIconWrap svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.emptyTitle{font-size:15px;font-weight:650;color:var(--text)}
.emptySub{margin-top:5px;font-size:13px;color:var(--muted);line-height:1.5}
.emptyResetBtn{margin:18px auto 0;padding:10px 20px;border-radius:100px;background:var(--surface2);
  border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:650}
.emptyResetBtn:active{transform:scale(.96)}

.navBar{position:sticky;bottom:0;display:flex;border-top:1px solid var(--line);
  background:rgba(9,9,11,.92);backdrop-filter:blur(14px);padding:10px 6px calc(10px + env(safe-area-inset-bottom));
  margin-top:26px}
.navItem{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);
  font-size:10.5px;font-weight:600;padding:4px 0;transition:transform .12s}
.navItem:active{transform:scale(.92)}
.navItem svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navItem.active{color:var(--gold)}

@media(prefers-reduced-motion:reduce){
  .learnTitle,.learnSub,.searchWrap,.chipRow,.group{animation:none}
  .navItem,.chip,.speakBtn,.wordRow{transition:none}
}
@media(max-height:740px){
  .learnTitle{font-size:29px}
  .wordRow{min-height:64px}
}
</style>
</head>
<body>
<div id="app">
  <main class="learnMain">

    <h1 class="learnTitle">Learn</h1>
    <p class="learnSub">Search and practise today's words.</p>

    <div class="searchWrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" class="searchInput" id="searchInput" placeholder="Search a word...">
      <button class="clearBtn" id="clearBtn" aria-label="Clear search">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="chipRow" id="chipRow"></div>

    <div class="resultsRow">
      <span class="resultsCount" id="resultsCount"></span>
    </div>

    <div class="group" id="wordGroup"></div>

    <div class="emptyState" id="emptyState">
      <div class="emptyIconWrap"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div>
      <div class="emptyTitle" id="emptyTitle">No matches</div>
      <div class="emptySub" id="emptySub">Try a different word, part of speech, or category.</div>
      <button class="emptyResetBtn" id="emptyResetBtn">Clear filters</button>
    </div>

  </main>

  <nav class="navBar">
    <button class="navItem"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</button>
    <button class="navItem active"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Learn</button>
    <button class="navItem"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 12V6"/><path d="M3 12h6"/></svg>Review</button>
    <button class="navItem"><svg viewBox="0 0 24 24"><path d="M5 20V11"/><path d="M12 20V4"/><path d="M19 20v-7"/></svg>Progress</button>
    <button class="navItem"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Profile</button>
  </nav>
</div>
<script src="lessons/day-01.js"></script>
<script src="lessons/day-02.js"></script>
<script src="lessons/day-03.js"></script>
<script src="lessons/registry.js"></script>
<script src="lessons/lesson-engine.js"></script>
<script>
// Word list comes from the lesson engine — never hardcoded here.
// Respects ?day=N in the URL (set by Home's "Start today's lesson"
// link); falls back to today's lesson if no day is specified.
var urlParams = new URLSearchParams(window.location.search);
var requestedDay = parseInt(urlParams.get('day'), 10);
var currentLesson = requestedDay
  ? window.LexoraLessons.getLessonByDay(requestedDay)
  : window.LexoraLessons.getTodayLesson();

var words = (currentLesson.words || []).map(function(w, i){
  return { title: w.word, pos: w.partOfSpeech, cat: w.category, idx: i };
});

var wordGroup = document.getElementById('wordGroup');
var emptyState = document.getElementById('emptyState');
var searchInput = document.getElementById('searchInput');
var clearBtn = document.getElementById('clearBtn');
var chipRow = document.getElementById('chipRow');
var resultsCount = document.getElementById('resultsCount');
var emptyResetBtn = document.getElementById('emptyResetBtn');

var activeCategory = 'All';
var speakSupported = 'speechSynthesis' in window;

// Build filter chips from the categories present in the word list
var categories = ['All'].concat(words.map(function(w){ return w.cat; }).filter(function(c, i, arr){
  return arr.indexOf(c) === i;
}));

categories.forEach(function(cat){
  var chip = document.createElement('button');
  chip.className = 'chip' + (cat === 'All' ? ' active' : '');
  chip.textContent = cat;
  chip.dataset.cat = cat;
  chip.addEventListener('click', function(){
    activeCategory = cat;
    Array.prototype.forEach.call(chipRow.children, function(c){
      c.classList.toggle('active', c.dataset.cat === cat);
    });
    applyFilters();
  });
  chipRow.appendChild(chip);
});

function speak(text, btn){
  if(!speakSupported) return;
  window.speechSynthesis.cancel();
  var utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-GB';
  utter.rate = 0.95;
  btn.classList.add('playing');
  utter.onend = function(){ btn.classList.remove('playing'); };
  utter.onerror = function(){ btn.classList.remove('playing'); };
  window.speechSynthesis.speak(utter);
}

function render(list){
  wordGroup.innerHTML = '';
  resultsCount.textContent = list.length + (list.length === 1 ? ' word' : ' words');
  if(list.length === 0){
    wordGroup.style.display = 'none';
    emptyState.classList.add('show');
    return;
  }
  wordGroup.style.display = 'block';
  emptyState.classList.remove('show');
  list.forEach(function(w){
    var row = document.createElement('button');
    row.className = 'wordRow';
    row.innerHTML =
      '<span class="wordText">' +
        '<span class="wordTitle">' + w.title + '</span>' +
        '<span class="wordMetaRow">' +
          '<span class="posPill">' + w.pos + '</span>' +
          '<span class="wordCat">' + w.cat + '</span>' +
        '</span>' +
      '</span>' +
      '<span class="speakBtn" role="button" aria-label="Hear pronunciation" tabindex="0">' +
        '<svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>' +
      '</span>' +
      '<span class="wordChevron">&rsaquo;</span>';

    var speakBtn = row.querySelector('.speakBtn');
    speakBtn.addEventListener('click', function(e){
      e.stopPropagation();
      speak(w.title, speakBtn);
    });

    row.addEventListener('click', function(){
      window.location.href = 'word-detail.html?day=' + currentLesson.day + '&idx=' + w.idx;
    });

    wordGroup.appendChild(row);
  });
}

function applyFilters(){
  var q = searchInput.value.trim().toLowerCase();
  var filtered = words.filter(function(w){
    var matchesCategory = activeCategory === 'All' || w.cat === activeCategory;
    var matchesQuery = q.length === 0 ||
      w.title.toLowerCase().indexOf(q) !== -1 ||
      w.pos.toLowerCase().indexOf(q) !== -1 ||
      w.cat.toLowerCase().indexOf(q) !== -1;
    return matchesCategory && matchesQuery;
  });
  render(filtered);
}

searchInput.addEventListener('input', function(){
  clearBtn.classList.toggle('show', searchInput.value.trim().length > 0);
  applyFilters();
});

clearBtn.addEventListener('click', function(){
  searchInput.value = '';
  clearBtn.classList.remove('show');
  searchInput.focus();
  applyFilters();
});

emptyResetBtn.addEventListener('click', function(){
  searchInput.value = '';
  clearBtn.classList.remove('show');
  activeCategory = 'All';
  Array.prototype.forEach.call(chipRow.children, function(c){
    c.classList.toggle('active', c.dataset.cat === 'All');
  });
  applyFilters();
});

render(words);

// Distinguish "curriculum genuinely finished" from "content not ready
// yet" — different situations, different honest messaging.
if(currentLesson.isComplete){
  document.getElementById('emptyTitle').textContent = 'Curriculum complete';
  document.getElementById('emptySub').textContent = 'You\u2019ve completed the current Lexora curriculum. More lessons are on the way.';
  document.getElementById('emptyResetBtn').style.display = 'none';
  searchInput.disabled = true;
  chipRow.style.display = 'none';
} else if(currentLesson.isFallback || words.length === 0){
  document.getElementById('emptyTitle').textContent = 'Lesson unavailable';
  document.getElementById('emptySub').textContent = 'Today\u2019s lesson content isn\u2019t ready yet. Please check back soon.';
  document.getElementById('emptyResetBtn').style.display = 'none';
  searchInput.disabled = true;
  chipRow.style.display = 'none';
}

document.querySelectorAll(".navItem").forEach(function(btn){
  var routes = {Home:"home.html", Learn:"learn.html", Review:"review.html", Progress:"progress.html", Profile:"profile.html"};
  var label = btn.textContent.trim();
  if(routes[label]){
    btn.addEventListener("click", function(){ window.location.href = routes[label]; });
  }
});
</script>
</body>
</html>
