<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#09090b">
<title>Lexora: Profile</title>
<style>
:root{--bg:#09090b;--surface:#121216;--surface2:#17171c;--line:#29282e;--text:#f1eee7;--muted:#918e95;--faint:#69666e;--gold:#c8a368;--gold-soft:rgba(200,163,104,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100dvh;overflow-x:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation;background:none;border:0;color:inherit}button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#app{min-height:100dvh;max-width:520px;margin:auto;background:var(--bg);display:flex;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}.backBtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#e9e6df}.backBtn:active{background:#18181d}.backBtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.topbarTitle{display:none}.topbarSpacer{width:36px}
.profileMain{padding:8px 20px 112px}.identity{position:relative;padding:24px 22px 23px;animation:fadeSlideUp .55s cubic-bezier(.16,1,.3,1) both;border:1px solid var(--line);border-radius:24px;background:var(--surface);overflow:hidden}.identity:after{content:"";position:absolute;width:240px;height:190px;left:50%;top:-92px;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 0,rgba(200,163,104,.30),rgba(200,163,104,.11) 42%,transparent 78%);filter:blur(18px);opacity:.8;pointer-events:none}.identityTop{display:flex;align-items:center;gap:14px;position:relative;z-index:1}.avatarZone{position:relative;width:84px;height:84px;flex:0 0 84px}.avatarRing{width:84px;height:84px;border-radius:50%;padding:3px;background:var(--gold)}.avatarRingInner{width:100%;height:100%;border-radius:50%;background:var(--surface2);padding:3px}.avatarInitial{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#211d17;color:var(--gold);font-size:31px;font-weight:650}.identityActions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;position:relative;z-index:1}.streakBadge{position:static;min-width:80px;height:29px;padding:0 9px;border-radius:15px;background:#1c1915;border:1px solid rgba(200,163,104,.55);display:flex;align-items:center;gap:6px;justify-content:center}.streakBadge svg{width:10px;height:10px;fill:var(--gold);stroke:none}.streakBadge span{color:var(--gold);font-size:11px;font-weight:700;line-height:1}.streakBadge small{color:var(--muted);font-size:8px;letter-spacing:.08em;text-transform:uppercase}.identityCopy{min-width:0}.eyebrow,.sectionKicker{color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.profileName{font-size:26px;line-height:1.05;font-weight:700;letter-spacing:-.04em;margin:0}.profileRole{margin-top:11px;color:var(--muted);font-size:10px;font-weight:650;letter-spacing:.1em;text-transform:uppercase}.identityFoot{display:flex;justify-content:space-between;align-items:end;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);position:relative;z-index:1}.identityFoot p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.identityFoot strong{display:block;color:var(--text);font-size:14px;margin-bottom:3px}.photoHint{position:relative;overflow:hidden;color:var(--muted);font-size:10px;letter-spacing:.02em;text-transform:none;border:1px solid #454149;border-radius:14px;padding:6px 9px;white-space:nowrap;transition:transform .12s ease,border-color .12s ease,color .12s ease}.photoHint:active{border-color:var(--gold);color:var(--gold);transform:scale(.96)}.photoHint:active{border-color:var(--gold);color:var(--gold)}
.section{margin-top:32px;animation:fadeSlideUp .55s cubic-bezier(.16,1,.3,1) both}.profileMain>section:nth-of-type(2){animation-delay:.08s}.profileMain>section:nth-of-type(3){animation-delay:.15s}.profileMain>section:nth-of-type(4){animation-delay:.22s}.sectionHead{display:flex;align-items:baseline;justify-content:space-between;padding:0 3px 12px}.sectionTitle{font-size:18px;font-weight:650;letter-spacing:-.025em}.sectionMeta{color:var(--faint);font-size:11px}.snapshot{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:1px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.metric{padding:17px 12px 16px 0;min-width:0}.metric+.metric{padding-left:14px;border-left:1px solid var(--line)}.metricValue{font-size:26px;line-height:1;font-weight:700;letter-spacing:-.04em}.metric:first-child .metricValue{color:var(--gold)}.metricLabel{margin-top:8px;color:var(--muted);font-size:11px;line-height:1.25}.metricDetail{margin-top:4px;color:var(--faint);font-size:10px}
.list{border-top:1px solid var(--line)}.listRow{width:100%;min-height:70px;display:flex;align-items:center;gap:15px;text-align:left;border-bottom:1px solid var(--line);transition:background .16s ease,padding .16s ease}.listRow:hover{background:#111116}.listRow:active{background:var(--gold-soft);padding-left:5px}.rowIcon{width:20px;flex:0 0 20px;color:var(--gold);display:grid;place-items:center}.rowIcon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}.rowText{min-width:0;flex:1}.rowTitle{display:block;color:var(--text);font-size:15px;font-weight:600;letter-spacing:-.015em}.rowSub{display:block;margin-top:4px;color:var(--muted);font-size:11.5px;line-height:1.3}.rowChevron{color:var(--faint);font-size:22px;font-weight:300}.preferenceRow{min-height:67px}.preferenceRow .rowIcon{color:var(--faint)}.preferenceRow .rowSub{color:var(--faint)}
.navBar{position:sticky;bottom:0;display:flex;border-top:1px solid var(--line);background:rgba(9,9,11,.94);backdrop-filter:blur(14px);padding:10px 6px calc(10px + env(safe-area-inset-bottom));z-index:2}.navItem{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--faint);font-size:10.5px;font-weight:600;padding:4px 0;transition:transform .12s,color .12s}.navItem:active{transform:scale(.92)}.navItem svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.navItem.active{color:var(--gold)}
@media(max-width:360px){.profileMain{padding-left:16px;padding-right:16px}.identity{padding-left:17px;padding-right:17px}.identityTop{gap:14px}.avatarZone,.avatarRing{width:82px;height:82px;flex-basis:82px}.profileName{font-size:25px}.identityFoot{margin-top:19px}.metricValue{font-size:23px}.metric+.metric{padding-left:10px}}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.navItem,.listRow,.photoHint{transition:none}.identity,.section{animation:none}}
</style>
</head>
<body>
<div id="app">
<header class="topbar"><button class="backBtn" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button><div class="topbarTitle" aria-hidden="true"></div><div class="topbarSpacer"></div></header>
<main class="profileMain">
<section class="identity" aria-labelledby="profile-name">
  <div class="identityTop"><button class="avatarZone" data-action="edit-photo" aria-label="Change profile photo"><div class="avatarRing"><div class="avatarRingInner"><div class="avatarInitial">M</div></div></div></button><div class="identityCopy"><div class="eyebrow">Your learning space</div><h1 class="profileName" id="profile-name">Michael</h1><div class="profileRole">Lexora Learner</div></div></div>
  <div class="identityActions"><div class="streakBadge"><svg viewBox="0 0 24 24"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-2-1-3-1-3 2 1 3 3 3 5a5 5 0 0 1-10 0c0-6 5-6 5-11z"/></svg><span>7</span><small>day streak</small></div><button class="photoHint" data-action="edit-photo">Edit photo</button></div>
  <div class="identityFoot"><p><strong>Keep your rhythm</strong>Your progress is building, one word at a time.</p></div>
</section>
<section class="section" aria-labelledby="snapshot-title"><div class="sectionHead"><h2 class="sectionTitle" id="snapshot-title">Learning snapshot</h2><span class="sectionMeta">This season</span></div><div class="snapshot"><div class="metric"><div class="metricValue">30</div><div class="metricLabel">Words learned</div><div class="metricDetail">Growing steadily</div></div><div class="metric"><div class="metricValue">12</div><div class="metricLabel">Words saved</div><div class="metricDetail">Ready to review</div></div><div class="metric"><div class="metricValue">84%</div><div class="metricLabel">Quiz average</div><div class="metricDetail">Strong rhythm</div></div></div></section>
<section class="section" aria-labelledby="learning-title"><div class="sectionHead"><h2 class="sectionTitle" id="learning-title">My learning</h2><span class="sectionMeta">Explore</span></div><div class="list"><button class="listRow" data-action="saved"><span class="rowIcon"><svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg></span><span class="rowText"><span class="rowTitle">Saved Words</span><span class="rowSub">Your personal vocabulary to revisit</span></span><span class="rowChevron">›</span></button><button class="listRow" data-action="history"><span class="rowIcon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span><span class="rowText"><span class="rowTitle">Learning History</span><span class="rowSub">A record of your recent activity</span></span><span class="rowChevron">›</span></button><button class="listRow" data-action="goal"><span class="rowIcon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span><span class="rowText"><span class="rowTitle">Daily Goal</span><span class="rowSub">Set the pace that works for you</span></span><span class="rowChevron">›</span></button></div></section>
<section class="section" aria-labelledby="preferences-title"><div class="sectionHead"><h2 class="sectionTitle" id="preferences-title">Preferences</h2><span class="sectionMeta">Make it yours</span></div><div class="list"><button class="listRow preferenceRow" data-action="reminders"><span class="rowIcon"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></span><span class="rowText"><span class="rowTitle">Reminders</span><span class="rowSub">Manage your daily learning reminders</span></span><span class="rowChevron">›</span></button><button class="listRow preferenceRow" data-action="sound"><span class="rowIcon"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg></span><span class="rowText"><span class="rowTitle">Sound</span><span class="rowSub">Learning sounds and feedback</span></span><span class="rowChevron">›</span></button><button class="listRow preferenceRow" data-action="appearance"><span class="rowIcon"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></span><span class="rowText"><span class="rowTitle">Appearance</span><span class="rowSub">Customise how Lexora looks</span></span><span class="rowChevron">›</span></button><button class="listRow preferenceRow" data-action="privacy"><span class="rowIcon"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 5-3.5 7.5-7 9-3.5-1.5-7-4-7-9V6z"/></svg></span><span class="rowText"><span class="rowTitle">Privacy</span><span class="rowSub">Manage your data and privacy</span></span><span class="rowChevron">›</span></button></div></section>
</main>
<nav class="navBar"><button class="navItem"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</button><button class="navItem"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Learn</button><button class="navItem"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 12V6"/><path d="M3 12h6"/></svg>Review</button><button class="navItem"><svg viewBox="0 0 24 24"><path d="M5 20V11"/><path d="M12 20V4"/><path d="M19 20v-7"/></svg>Progress</button><button class="navItem active"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Profile</button></nav>
</div>
<script>
(function(){var navRoutes={Home:'home.html',Learn:'learn.html',Review:'review.html',Progress:'progress.html',Profile:'profile.html'};var actionRoutes={'edit-photo':'profile-photo.html',saved:'saved-words.html',history:'learning-history.html',goal:'daily-goal.html',reminders:'reminders.html',sound:'sound.html',appearance:'appearance.html',privacy:'privacy.html'};function go(route){window.location.href=route}document.querySelector('.backBtn').addEventListener('click',function(){if(window.history.length>1)window.history.back();else go('home.html')});document.querySelectorAll('[data-action]').forEach(function(btn){var route=actionRoutes[btn.getAttribute('data-action')];if(route)btn.addEventListener('click',function(){go(route)})});document.querySelectorAll('.navItem').forEach(function(btn){var route=navRoutes[btn.textContent.trim()];if(route)btn.addEventListener('click',function(){go(route)})})})();
</script>
</body>
</html>
