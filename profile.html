<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0b0e">
<title>Lexora — Profile</title>
<style>
:root{--bg:#0a0b0e;--panel:#111318;--panel-2:#15171d;--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.14);--text:#f6f3ec;--muted:#94959d;--dim:#63656d;--gold:#d2ad6f;--gold-bright:#edc984;--gold-wash:rgba(210,173,111,.11)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100dvh;overflow-x:hidden;background:radial-gradient(ellipse 85% 48% at 50% -8%,rgba(225,188,116,.14),transparent 68%),radial-gradient(ellipse 62% 42% at 100% 58%,rgba(133,91,43,.08),transparent 72%),radial-gradient(ellipse 70% 50% at 0 88%,rgba(101,74,38,.09),transparent 70%),var(--bg)}
body:before,body:after{content:"";position:fixed;z-index:0;pointer-events:none;border-radius:50%;mix-blend-mode:screen}
body:before{width:560px;height:450px;top:-270px;right:-180px;background:radial-gradient(ellipse at 48% 60%,rgba(244,205,132,.29) 0,rgba(210,173,111,.17) 24%,rgba(126,86,37,.07) 43%,transparent 73%);filter:blur(24px);opacity:.82;animation:driftGlow 16s ease-in-out infinite alternate}
body:after{width:400px;height:400px;left:-230px;top:30%;background:radial-gradient(circle,rgba(213,169,94,.11) 0,rgba(149,104,49,.05) 32%,transparent 69%);filter:blur(28px);opacity:.72;animation:driftGlow 20s ease-in-out -5s infinite alternate-reverse}
button{font:inherit;cursor:pointer;touch-action:manipulation;background:none;border:0;color:inherit}button:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px}
#app{min-height:100dvh;max-width:560px;margin:auto;display:flex;flex-direction:column;position:relative;z-index:1;background:linear-gradient(180deg,rgba(10,11,14,.30),rgba(10,11,14,.78) 38%,rgba(10,11,14,.97) 82%)}
.topbar{height:72px;padding:17px 22px 13px;display:flex;align-items:center;justify-content:space-between}.backBtn{width:40px;height:40px;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;color:#f1eee7;background:rgba(255,255,255,.025);transition:background .2s,border-color .2s,transform .2s}.backBtn:hover{background:rgba(255,255,255,.07);border-color:var(--line-strong)}.backBtn:active{transform:scale(.94)}.backBtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.topbarTitle{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.topbarSpacer{width:40px}
.profileMain{padding:10px 22px 132px}.hero{position:relative;animation:rise .65s cubic-bezier(.16,1,.3,1) both;transition:transform .35s cubic-bezier(.16,1,.3,1),filter .35s ease}.hero:before{content:"";position:absolute;inset:-12px -14px;border:1px solid transparent;border-radius:28px;background:radial-gradient(ellipse at 22% 18%,rgba(210,173,111,.07),transparent 48%);opacity:0;pointer-events:none;transition:opacity .35s ease}.hero:hover{transform:translateY(-2px);filter:drop-shadow(0 14px 26px rgba(0,0,0,.16))}.hero:hover:before{opacity:1}.hero:hover .avatarRing{box-shadow:0 0 0 7px rgba(210,173,111,.07),0 0 28px rgba(210,173,111,.16),0 18px 42px rgba(0,0,0,.35)}.heroHeader{display:flex;align-items:center;gap:25px;padding:17px 2px 28px}.avatarZone{position:relative;width:90px;height:90px;flex:0 0 90px}.avatarRing{width:100%;height:100%;border-radius:50%;padding:2px;background:linear-gradient(145deg,var(--gold-bright),#8b6a38 70%,#4c3d28);box-shadow:0 0 0 7px rgba(210,173,111,.045),0 18px 42px rgba(0,0,0,.35)}.avatarRingInner{width:100%;height:100%;border-radius:50%;background:#17191e;padding:4px;overflow:hidden}.avatarInitial{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover;object-position:var(--avatar-focus-x,50%) var(--avatar-focus-y,35%);background:#17181c}.presenceDot{position:absolute;right:-1px;bottom:1px;width:15px;height:15px;border:3px solid var(--bg);border-radius:50%;background:#8fc69c;box-shadow:0 0 0 1px rgba(143,198,156,.35),0 3px 10px rgba(0,0,0,.32);display:none}.avatarZone[data-online="true"] .presenceDot{display:block}
.identityCopy{min-width:0;display:flex;flex-direction:column;align-items:flex-start}.profileName{font-size:38px;line-height:.98;font-weight:720;letter-spacing:-.065em;margin:0}.profileRole{display:inline-flex;align-items:center;gap:0;margin-top:7px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.streakBadge{display:inline-flex;align-items:center;gap:8px;margin-top:9px;padding:6px 9px;border:1px solid rgba(210,173,111,.38);border-radius:999px;background:rgba(52,38,20,.48);box-shadow:0 5px 18px rgba(0,0,0,.14),inset 0 1px rgba(255,255,255,.05);color:var(--gold-bright);font-size:10px;font-weight:750;letter-spacing:.03em}.streakBadge svg{width:12px;height:12px;fill:var(--gold-bright);stroke:none}.streakBadge small{color:var(--muted);font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.heroFooter{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:18px 1px 0}.heroStatement{margin:0;color:var(--muted);font-size:13px;line-height:1.4}.heroStatement strong{display:block;margin-bottom:3px;color:var(--text);font-size:15px;letter-spacing:-.02em}.editBtn{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border:1px solid var(--line-strong);border-radius:12px;color:var(--gold-bright);font-size:11px;font-weight:700;transition:background .2s,border-color .2s,transform .2s}.editBtn:hover{background:var(--gold-wash);border-color:rgba(210,173,111,.45)}.editBtn:active{transform:scale(.96)}.editBtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.section{margin-top:34px;animation:rise .65s cubic-bezier(.16,1,.3,1) both}.section:nth-of-type(2){animation-delay:.08s}.section:nth-of-type(3){animation-delay:.14s}.section:nth-of-type(4){animation-delay:.2s}.sectionHead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}.sectionTitle{font-size:19px;font-weight:680;letter-spacing:-.035em;margin:0}.sectionMeta{color:var(--dim);font-size:11px;font-weight:600;letter-spacing:.03em}
.snapshot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:1px;border:1px solid var(--line);border-radius:20px;background:var(--line);overflow:hidden}.metric{min-width:0;min-height:120px;padding:19px 15px;background:rgba(17,19,24,.94)}.metric+.metric{border-left:1px solid rgba(255,255,255,.09)}.metric:first-child{border-radius:19px 0 0 19px}.metric:last-child{border-radius:0 19px 19px 0}.metricValue{font-size:29px;line-height:1;font-weight:720;letter-spacing:-.06em;opacity:0;transform:translateY(4px);animation:statReveal .7s cubic-bezier(.16,1,.3,1) forwards}.metric:nth-child(2) .metricValue{animation-delay:.08s}.metric:nth-child(3) .metricValue{animation-delay:.16s}.metric:first-child .metricValue{color:var(--gold-bright)}.metricLabel{margin-top:12px;color:var(--muted);font-size:11px;font-weight:600;line-height:1.2}.metricDetail{margin-top:5px;color:var(--dim);font-size:10px;line-height:1.2}
.list{display:grid;gap:9px}.listRow{width:100%;min-height:74px;display:flex;align-items:center;gap:14px;text-align:left;padding:14px 15px;border:1px solid var(--line);border-radius:17px;background:rgba(17,19,24,.72);transition:transform .2s,border-color .2s,background .2s}.listRow:hover{transform:translateY(-2px);border-color:rgba(210,173,111,.32);background:rgba(24,24,28,.9)}.listRow:active{transform:scale(.985);background:var(--gold-wash)}.rowIcon{width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;border-radius:12px;color:var(--gold-bright);background:var(--gold-wash)}.rowIcon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.rowText{min-width:0;flex:1}.rowTitle{display:block;color:var(--text);font-size:14px;font-weight:650;letter-spacing:-.015em}.rowSub{display:block;margin-top:4px;color:var(--muted);font-size:11px;line-height:1.3}.rowChevron{color:var(--dim);font-size:23px;font-weight:300;line-height:1}.preferenceRow{min-height:68px;background:rgba(17,19,24,.48)}.preferenceRow .rowIcon{color:var(--muted);background:rgba(255,255,255,.055)}.preferenceRow .rowSub{color:var(--dim)}
.navBar{position:fixed;bottom:0;left:50%;width:min(560px,100%);transform:translateX(-50%);display:flex;border-top:1px solid var(--line);background:rgba(10,11,14,.88);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding:11px 8px calc(11px + env(safe-area-inset-bottom));z-index:5}.navItem{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--dim);font-size:10px;font-weight:650;padding:4px 0;transition:transform .15s,color .15s}.navItem:active{transform:scale(.92)}.navItem svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.navItem.active{color:var(--gold-bright)}
@media(max-width:380px){.profileMain{padding-left:17px;padding-right:17px}.heroHeader{gap:18px}.avatarZone,.avatarRing{width:78px;height:78px;flex-basis:78px}.profileName{font-size:33px}.metric{padding-left:11px;padding-right:11px}.metricValue{font-size:25px}.metricLabel{font-size:10px}.heroFooter{align-items:flex-start;gap:12px}.heroStatement{font-size:12px}}
@keyframes rise{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}
@keyframes driftGlow{from{transform:translate3d(-10px,0,0) scale(1)}to{transform:translate3d(13px,18px,0) scale(1.08)}}
@keyframes statReveal{to{opacity:1;transform:translateY(0)}}
@media(hover:none){.hero:hover{transform:none;filter:none}.hero:hover:before{opacity:0}.hero:hover .avatarRing{box-shadow:0 0 0 7px rgba(210,173,111,.045),0 18px 42px rgba(0,0,0,.35)}}
@media(prefers-reduced-motion:reduce){.hero,.section{animation:none}.metricValue{opacity:1;transform:none;animation:none}.listRow,.backBtn,.editBtn{transition:none}.hero,.hero:before,.avatarRing{transition:none}}
</style>
</head>
<body>
<div id="app">
<header class="topbar"><button class="backBtn" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button><div class="topbarTitle">Profile</div><div class="topbarSpacer"></div></header>
<main class="profileMain">
<section class="hero" aria-labelledby="profile-name">
  <div class="heroHeader"><button class="avatarZone" data-action="edit-photo" aria-label="Change profile photo"><div class="avatarRing"><div class="avatarRingInner"><img class="avatarInitial" src="assets/profile-michael-head.jpg" alt="Michael"></div></div><span class="presenceDot" aria-label="Online" role="status"></span></button><div class="identityCopy"><h1 class="profileName" id="profile-name">Michael</h1><div class="profileRole">Lexora Learner</div><div class="streakBadge"><svg viewBox="0 0 24 24"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-2-1-3-1-3 2 1 3 3 3 5a5 5 0 0 1-10 0c0-6 5-6 5-11z"/></svg><span>7</span><small>day streak</small></div></div></div>
  <div class="heroFooter"><p class="heroStatement"><strong>Keep your rhythm.</strong>One word at a time.</p><button class="editBtn" data-action="edit-photo"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>Edit profile</button></div>
</section>
<section class="section" aria-labelledby="snapshot-title"><div class="sectionHead"><h2 class="sectionTitle" id="snapshot-title">Learning snapshot</h2><span class="sectionMeta">This season</span></div><div class="snapshot"><div class="metric"><div class="metricValue">30</div><div class="metricLabel">Words learned</div><div class="metricDetail">Growing steadily</div></div><div class="metric"><div class="metricValue">12</div><div class="metricLabel">Words saved</div><div class="metricDetail">Ready to review</div></div><div class="metric"><div class="metricValue">84%</div><div class="metricLabel">Quiz average</div><div class="metricDetail">Strong rhythm</div></div></div></section>
<section class="section" aria-labelledby="learning-title"><div class="sectionHead"><h2 class="sectionTitle" id="learning-title">My learning</h2><span class="sectionMeta">Explore</span></div><div class="list"><button class="listRow" data-action="saved"><span class="rowIcon"><svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg></span><span class="rowText"><span class="rowTitle">Saved Words</span><span class="rowSub">Your personal vocabulary to revisit</span></span><span class="rowChevron">›</span></button><button class="listRow" data-action="history"><span class="rowIcon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span><span class="rowText"><span class="rowTitle">Learning History</span><span class="rowSub">A record of your recent activity</span></span><span class="rowChevron">›</span></button><button class="listRow" data-action="goal"><span class="rowIcon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span><span class="rowText"><span class="rowTitle">Daily Goal</span><span class="rowSub">Set the pace that works for you</span></span><span class="rowChevron">›</span></button></div></section>
<section class="section" aria-labelledby="preferences-title"><div class="sectionHead"><h2 class="sectionTitle" id="preferences-title">Preferences</h2><span class="sectionMeta">Make it yours</span></div><div class="list"><button class="listRow preferenceRow" data-action="reminders"><span class="rowIcon"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></span><span class="rowText"><span class="rowTitle">Reminders</span><span class="rowSub">Manage your daily learning reminders</span></span><span class="rowChevron">›</span></button><button class="listRow preferenceRow" data-action="sound"><span class="rowIcon"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg></span><span class="rowText"><span class="rowTitle">Sound</span><span class="rowSub">Learning sounds and feedback</span></span><span class="rowChevron">›</span></button><button class="listRow preferenceRow" data-action="appearance"><span class="rowIcon"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></span><span class="rowText"><span class="rowTitle">Appearance</span><span class="rowSub">Customise how Lexora looks</span></span><span class="rowChevron">›</span></button><button class="listRow preferenceRow" data-action="privacy"><span class="rowIcon"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 5-3.5 7.5-7 9-3.5-1.5-7-4-7-9V6z"/></svg></span><span class="rowText"><span class="rowTitle">Privacy</span><span class="rowSub">Manage your data and privacy</span></span><span class="rowChevron">›</span></button></div></section>
</main>
<nav class="navBar"><button class="navItem"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</button><button class="navItem"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Learn</button><button class="navItem"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 12V6"/><path d="M3 12h6"/></svg>Review</button><button class="navItem"><svg viewBox="0 0 24 24"><path d="M5 20V11"/><path d="M12 20V4"/><path d="M19 20v-7"/></svg>Progress</button><button class="navItem active"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Profile</button></nav>
</div>
<script>
(function(){
  var snapshot = document.querySelector('.snapshot');
  var values = document.querySelectorAll('.metricValue');
  var counted = false;
  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function formatValue(value, original){
    var hasPercent = /%$/.test(original), hasPlus = /\+$/.test(original);
    var formatted = Math.round(value).toLocaleString('en-US');
    return formatted + (hasPercent ? '%' : '') + (hasPlus ? '+' : '');
  }
  function animateValue(element){
    var original = element.textContent.trim();
    var match = original.replace(/,/g, '').match(/-?\d+(?:\.\d+)?/);
    if(!match){return;}
    var target = Number(match[0]);
    if(!Number.isFinite(target)){return;}
    if(reducedMotion || target === 0){element.textContent = original;return;}
    var start = performance.now();
    var duration = Math.min(1500, Math.max(520, 520 + Math.log10(Math.max(target,1)) * 260));
    function tick(now){
      var progress = Math.min(1, (now - start) / duration);
      var eased = 1 - Math.pow(1 - progress, 3);
      element.textContent = formatValue(target * eased, original);
      if(progress < 1){window.requestAnimationFrame(tick);}else{element.textContent = original;}
    }
    window.requestAnimationFrame(tick);
  }
  function startCounter(){
    if(counted){return;}
    counted = true;
    values.forEach(animateValue);
  }
  if(snapshot){
    if(reducedMotion || !('IntersectionObserver' in window)){startCounter();}
    else{
      var observer = new IntersectionObserver(function(entries){
        if(entries.some(function(entry){return entry.isIntersecting;})){startCounter();observer.disconnect();}
      },{threshold:.22});
      observer.observe(snapshot);
    }
  }
  var avatar = document.querySelector('.avatarZone');
  var API_BASE = 'https://lexora-web.onrender.com';
  var presenceTimer = null;
  var presenceTimeout = null;
  var lastActivity = Date.now();
  var presenceActive = true;
  var activityEvents = ['pointerdown','keydown','touchstart','scroll'];
  function setOnline(online){ if(avatar) avatar.dataset.online = online ? 'true' : 'false'; }
  function clearPresence(){ clearTimeout(presenceTimeout); setOnline(false); }
  function heartbeat(){
    if(document.visibilityState !== 'visible' || Date.now() - lastActivity > 120000){ clearPresence(); return; }
    fetch(API_BASE + '/v1/presence/heartbeat', {method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}})
      .then(function(response){ if(!response.ok) throw new Error('presence_unavailable'); setOnline(true); clearTimeout(presenceTimeout); presenceTimeout=setTimeout(clearPresence, 75000); })
      .catch(clearPresence);
  }
  function noteActivity(){ lastActivity=Date.now(); if(!presenceActive){presenceActive=true; heartbeat();} }
  activityEvents.forEach(function(eventName){window.addEventListener(eventName, noteActivity, {passive:true});});
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible'){lastActivity=Date.now(); heartbeat();}else{presenceActive=false; clearPresence();} });
  heartbeat();
  presenceTimer = window.setInterval(heartbeat, 30000);
  var navRoutes={Home:'home.html',Learn:'learn.html',Review:'review.html',Progress:'progress.html',Profile:'profile.html'};var actionRoutes={'edit-photo':'profile-photo.html',saved:'saved-words.html',history:'learning-history.html',goal:'daily-goal.html',reminders:'reminders.html',sound:'sound.html',appearance:'appearance.html',privacy:'privacy.html'};function go(route){window.location.href=route}document.querySelector('.backBtn').addEventListener('click',function(){if(window.history.length>1)window.history.back();else go('home.html')});document.querySelectorAll('[data-action]').forEach(function(btn){var route=actionRoutes[btn.getAttribute('data-action')];if(route)btn.addEventListener('click',function(){go(route)})});document.querySelectorAll('.navItem').forEach(function(btn){var route=navRoutes[btn.textContent.trim()];if(route)btn.addEventListener('click',function(){go(route)})})})();
</script>
</body>
</html>
