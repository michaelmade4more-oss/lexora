<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexora AI</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <div id="root">
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;color:#94a3b8;">
      Loading Lexora...
    </div>
  </div>

  <!-- React 18 & Babel Standalone (Cloudflare CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>

  <script type="text/babel">
    const { useState } = React;

    const SparklesIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
      </svg>
    );

    const SendIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
      </svg>
    );

    function App() {
      const [messages, setMessages] = useState([
        { role: 'assistant', text: 'Hello! I am Lexora, your AI companion. How can I help you today?' }
      ]);
      const [input, setInput] = useState('');

      const handleSend = () => {
        if (!input.trim()) return;
        const userMsg = input;
        setMessages(prev => [...prev, { role: 'user', text: userMsg }]);
        setInput('');
        setTimeout(() => {
          setMessages(prev => [
            ...prev,
            { role: 'assistant', text: `Received: "${userMsg}". Lexora prototype is active!` }
          ]);
        }, 600);
      };

      return (
        <div className="flex flex-col h-screen max-w-2xl mx-auto p-4">
          <header className="flex items-center gap-3 py-4 border-b border-slate-800 mb-4">
            <div className="p-2.5 bg-indigo-600 rounded-xl text-white shadow-lg shadow-indigo-500/30">
              <SparklesIcon />
            </div>
            <div>
              <h1 className="text-xl font-bold text-white">Lexora AI</h1>
              <p className="text-xs text-emerald-400 font-medium">● Online & Ready</p>
            </div>
          </header>

          <main className="flex-1 overflow-y-auto space-y-4 pr-1">
            {messages.map((m, idx) => (
              <div
                key={idx}
                className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}
              >
                <div
                  className={`max-w-[85%] rounded-2xl px-4 py-3 text-sm leading-relaxed ${
                    m.role === 'user'
                      ? 'bg-indigo-600 text-white rounded-br-none shadow-md'
                      : 'bg-slate-800 text-slate-200 rounded-bl-none border border-slate-700/80 shadow-md'
                  }`}
                >
                  {m.text}
                </div>
              </div>
            ))}
          </main>

          <footer className="pt-4 border-t border-slate-800 mt-2">
            <div className="flex gap-2">
              <input
                type="text"
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleSend()}
                placeholder="Ask Lexora anything..."
                className="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder-slate-500"
              />
              <button
                onClick={handleSend}
                className="bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-xl transition-all shadow-md active:scale-95"
              >
                <SendIcon />
              </button>
            </div>
          </footer>
        </div>
      );
    }

    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
