  color = "currentColor",
  strokeWidth = 1.8
}) {

      height: size,
      viewBox: "0 0 24 24",
      fill: "none",
      stroke: color,
      strokeWidth,
      strokeLinecap: "round",
      strokeLinejoin: "round"

    children
  );

}

/* =========================================================
   STORAGE
========================================================= */

function loadData() {

  try {

    const saved =
      JSON.parse(localStorage.getItem("lexoraData"));

    if (saved) return saved;

  } catch (e) {}

  return {

    streak: 0,

    completedDays: [],

    completedWords: [],

    savedWords: [],

    totalLessons: 0,

    lastCompletedDate: "",

    pronunciationScore: 0

  };

}


function saveData(data) {

  try {

    localStorage.setItem(
      "lexoraData",
      JSON.stringify(data)
    );

  } catch (e) {}

}


/* =========================================================
   DATE HELPERS
========================================================= */

function todayKey() {

  const d = new Date();

  return (
    d.getFullYear() +
    "-" +
    String(d.getMonth() + 1).padStart(2, "0") +
    "-" +
    String(d.getDate()).padStart(2, "0")
  );

}


function dayName() {

  return [
    "Sunday",
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday"
  ][new Date().getDay()];

}


function shortDay(index) {

  return [
    "SUN",
    "MON",
    "TUE",
    "WED",
    "THU",
    "FRI",
    "SAT"
  ][index];

}

function Label({ children }) {

  return (
    <div style={{
      fontSize: 11,
      letterSpacing: "0.12em",
      color: T.textFaint,
      fontWeight: 700,
      textTransform: "uppercase"

    </div>
  );

}


function Button({
  children,
  onClick,
  secondary = false,
  disabled = false
}) {

  return (
    <button
      onClick={onClick}
      disabled={disabled}
      style={{
        width: "100%",
        border: secondary
          ? `1px solid ${T.borderStrong}`
          : "none",
        borderRadius: 16,
        padding: "15px 18px",
        background: disabled
          ? T.cardAlt
          : secondary
          ? T.cardAlt
          : T.accent,
        color: disabled
          ? T.textFaint
          : secondary
          ? T.text
          : "#181209",
        fontWeight: 700,
        fontSize: 14,
        cursor: disabled
          ? "not-allowed"
          : "pointer",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        gap: 8
      }}
    >
      {children}
    </button>
  );

}

/* =========================================================
   WEEK TRACKER
========================================================= */

function WeekTracker({
  data,
  onReview
}) {

  const now = new Date();

  const currentDay = now.getDay();

  const mondayIndex =
    currentDay === 0
      ? 6
      : currentDay - 1;


  const days = [
    "MON",
    "TUE",
    "WED",
    "THU",
    "FRI",
    "SAT",
    "SUN"
  ];


  return (
    <div>

      <Label>This week</Label>

      <div style={{
        marginTop: 12,
        background: T.card,
        border: `1px solid ${T.border}`,
        borderRadius: 22,
        padding: "17px 9px",
        display: "flex",
        justifyContent: "space-between"
      }}>

        {days.map((day, i) => {

          const complete =
            data.completedDays.includes(day);

          const today =
            i === mondayIndex;

          const sunday =
            day === "SUN";

          return (
            <div
              key={day}
              onClick={
                sunday
                  ? onReview
                  : undefined
              }
              style={{
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                gap: 8,
                cursor:
                  sunday
                    ? "pointer"
                    : "default"
              }}
            >

              <span style={{
                fontSize: 9,
                fontWeight: 700,
                color: T.textFaint
              }}>
                {day}
              </span>

              <div style={{
                width: 25,
                height: 25,
                borderRadius: "50%",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                background:
                  complete
                    ? T.accentSoft
                    : today
                    ? T.accent
                    : "transparent",
                border:
                  complete
                    ? `1px solid ${T.accentLine}`
                    : today
                    ? "none"
                    : sunday
                    ? `1px dashed ${T.textFaint}`
                    : `1px solid ${T.border}`
              }}>

                {complete && (
                  <CheckIcon
                    size={12}
                    color={T.accent}
                    strokeWidth={2.5}
                  />
                )}

              </div>

            </div>
          );

        })}

      </div>

    </div>
  );

}
