<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#09090b">
<title>Lexora</title>
<style>
:root{--bg:#09090b;--surface:#121216;--surface2:#17171c;--line:#29282f;--text:#f1eee7;--muted:#89878e;--faint:#626067;--gold:#c8a368;--gold2:#a9874e;--danger:#e06b76}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100dvh;overflow-x:hidden}
button,input,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}
#app{min-height:100dvh;max-width:480px;margin:auto;background:var(--bg)}
.screen{min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;overflow:auto;padding:22px 20px 94px;scrollbar-width:none}main::-webkit-scrollbar{display:none}
h1,h2,h3,p{margin:0}h1,h2,h3{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;font-weight:650;letter-spacing:-.035em}
h1{font-size:28px;line-height:1.12}h2{font-size:24px;line-height:1.18}
p{font-size:15px;line-height:1.48}.muted{color:var(--muted)}.faint{color:var(--faint)}.gold{color:var(--gold)}
.label{font-size:10px;line-height:1.2;letter-spacing:.13em;text-transform:uppercase;color:#716e76;font-weight:700}
.pageHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.pageHead h1{font-size:27px}.headAction{width:34px;height:34px;border:0;background:transparent;color:#9b989f;display:grid;place-items:center;border-radius:50%}.headAction:active{background:#18181d}
.card{background:var(--surface);border:1px solid var(--line);border-radius:21px;padding:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{width:100%;border:0;border-radius:15px;padding:14px 16px;background:var(--gold);color:#19140c;font-weight:700;font-size:15px}.btn:active{transform:scale(.985)}.btn.secondary{background:#202026;color:#eee}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(18,18,22,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid #25242a;padding:7px 5px calc(8px + env(safe-area-inset-bottom));z-index:50}
.nav button{border:0;background:none;color:#77747c;font-size:10px;padding:5px 2px 4px;min-height:51px}.nav button.active{color:var(--gold)}.navIcon{height:22px;display:grid;place-items:center;margin-bottom:4px}.navIcon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.heroTitle{font-size:29px;margin-top:7px}.homeMain{padding-top:44px}.heroSub{margin-top:6px;color:#817f86;font-size:15px;max-width:320px}
.lessonCard{margin-top:20px;padding:18px 18px 17px}.lessonMeta{font-size:14px;color:#8f8c94}.lessonMeta .gold{font-weight:600}.progressDots{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:17px 0}.progressDots i{display:block;height:4px;border-radius:99px;background:#3a3428}.progressDots i.done{background:var(--gold)}
.streakBlock{margin:34px 1px 20px}.streak{font-size:19px;font-weight:700;letter-spacing:-.02em}.streakSub{font-size:13px;margin-top:4px;color:#747179}
.weekCard{padding:15px 10px 14px;margin-top:16px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.day{text-align:center;font-size:9px;color:#716e76}.dot{width:28px;height:28px;border-radius:50%;margin:7px auto 0;border:1px solid #303037;display:grid;place-items:center;font-size:12px}.dot.done{border-color:#594a34;background:#1e1a14;color:var(--gold)}.dot.today{border-color:var(--gold);background:var(--gold);color:#19140c}.dot.empty{background:transparent}.weekNote{font-size:11px;margin-top:9px;color:#69666e}
.section{margin-top:20px}.section p{margin-top:7px;color:#b7b4bb}.quote{border-left:2px solid #c8a36855;padding-left:12px;color:#aaa7ae;font-style:italic}
.wordHero{text-align:center;background:linear-gradient(145deg,#1c1a17,#15151a);border:1px solid #332e27;border-radius:22px;padding:26px 17px}.word{font:650 40px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.04em;margin:9px 0 4px}.audio{display:flex;justify-content:center;gap:8px;margin-top:16px}.audio button{border:1px solid #333139;background:#202026;color:#eee;border-radius:12px;padding:9px 13px;font-size:13px}.audio button:active{background:#29282f}
.choice{display:block;width:100%;text-align:left;background:#19191e;border:1px solid #2b2a31;color:#eee;border-radius:14px;padding:14px;margin-top:9px;font-size:14px;line-height:1.45}.choice.correct{border-color:#76a987;background:#76a98718}.choice.wrong{border-color:#c2716b;background:#c2716b18}.choice.selected{outline:2px solid #c9a45f55;outline-offset:1px}.choice:disabled{opacity:1;cursor:default}
.quizFeedback{margin-top:16px;padding:13px 14px;border:1px solid var(--line);background:#17171c;border-radius:15px;display:flex;gap:10px;align-items:flex-start}
.quizFeedbackIcon{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:0 0 28px;font-size:13px;border:1px solid #51462f;color:var(--gold);background:#c9a45f12}
.quizFeedbackTitle{font-size:13px;font-weight:700}.quizFeedbackText{font-size:12px;line-height:1.45;color:var(--muted);margin-top:3px}
.quizNext{margin-top:13px}
textarea,input{width:100%;background:#18181d;border:1px solid #302f36;border-radius:14px;color:#eee;padding:13px;outline:none}input::placeholder{color:#66636b}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:16px}.stat b{font:650 23px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.statLabel{display:block;color:#77747c;font-size:11px;margin-top:4px}
.back{background:none;border:0;color:#aaa;padding:4px 0;margin-bottom:13px;font-size:14px}
.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#242329;border:1px solid #3a3840;border-radius:13px;padding:10px 14px;font-size:12px;z-index:80;white-space:nowrap;box-shadow:0 8px 30px #0008}
/* compact profile */
.profileTop{display:flex;align-items:center;gap:13px;margin-top:5px}.profileAvatar{width:64px;height:64px;flex:0 0 64px;border-radius:50%;object-fit:cover;object-position:center 27%;border:1.5px solid #8e6f3d;box-shadow:0 0 0 3px #8e6f3d12}.profileName{font-size:20px;font-weight:650;letter-spacing:-.03em;line-height:1.1}.profileRole{font-size:11.5px;color:#7f7c84;margin-top:4px}.profileStreak{display:inline-flex;align-items:center;gap:6px;border:1px solid #443a2c;border-radius:99px;padding:6px 9px;margin-top:8px;color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.04em}
.profileStats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:13px 7px}.pstat{text-align:center;padding:2px 5px}.pstat+.pstat{border-left:1px solid #2a292f}.picon{height:20px;color:var(--gold);display:grid;place-items:center;margin-bottom:7px}.picon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.pnum{font-size:22px;font-weight:650;letter-spacing:-.03em}.plabel{font-size:10px;color:#77747c;margin-top:3px;line-height:1.2}
.profileMenu{margin-top:16px;padding:8px 18px}.menuRow{width:100%;display:flex;align-items:center;gap:14px;padding:15px 2px;background:none;border:0;color:var(--text);text-align:left;min-height:67px}.menuRow+.menuRow{border-top:1px solid #26252b}.menuIcon{width:40px;height:40px;flex:0 0 40px;border:1px solid #303037;border-radius:50%;display:grid;place-items:center;color:var(--gold)}.menuIcon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}.menuText{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:3px}.menuTitle{display:block;font-size:14.5px;line-height:1.25;font-weight:560;letter-spacing:-.01em}.menuSub{display:block;font-size:11.5px;line-height:1.35;color:#706d75;white-space:normal}.chev{margin-left:auto;flex:0 0 auto;color:#66636b;font-size:22px;line-height:1}.signout{margin-top:12px}.signout .menuIcon{color:var(--danger);border-color:#4a2b31}.signout .menuTitle{color:#e06b76}
@media(max-height:720px){.homeMain{padding-top:30px}.streakBlock{margin-top:25px}.weekCard{margin-top:12px}main{padding-top:18px}.lessonCard{margin-top:16px}.streakBlock{margin:15px 1px}.weekCard{padding-top:12px;padding-bottom:11px}.profileStats{margin-top:14px}.menuRow{padding:13px 2px;min-height:62px}.profileMenu{margin-top:12px;padding-left:15px;padding-right:15px}}

/* HOME RESTORE: compact hierarchy, controlled negative space, no oversized text */
.homeMain{padding-top:28px}
.homeMain .label{font-size:10px;line-height:1.2;letter-spacing:.13em}
.heroTitle{font-size:27px;line-height:1.1;font-weight:650;letter-spacing:-.035em;margin-top:7px}
.heroSub{margin-top:7px;font-size:15px;line-height:1.45;max-width:310px;color:#817f86}
.lessonCard{margin-top:18px;padding:18px 18px 17px;border-radius:21px}
.lessonMeta{font-size:14px;line-height:1.25}
.progressDots{gap:7px;margin:16px 0 17px}
.progressDots i{height:4px}
.btn{font-size:15px;line-height:1.2;padding:14px 16px;min-height:50px;border-radius:15px}
.streakBlock{margin:30px 1px 18px}
.streak{font-size:18px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.streakSub{font-size:13px;line-height:1.4;margin-top:5px}
.homeMain>.label + .heroTitle + .heroSub + .lessonCard + .streakBlock + .label{margin-top:0}
.weekCard{margin-top:14px;padding:15px 10px 14px;border-radius:21px}
.week{gap:2px}
.day{font-size:9px;line-height:1.2}
.dot{width:28px;height:28px;margin-top:7px;font-size:12px}
.weekNote{font-size:11px;line-height:1.35;margin-top:9px}
@media(max-width:380px){
  .homeMain{padding-top:24px}
  .heroTitle{font-size:26px}
  .heroSub{font-size:14px}
  .lessonCard{margin-top:17px;padding:17px 16px 16px}
  .streakBlock{margin-top:27px;margin-bottom:17px}
}

.characterCard{margin:24px 0 26px;border:1px solid var(--line);background:linear-gradient(145deg,#17171c,#111115);border-radius:22px;min-height:150px;padding:18px 16px;display:flex;align-items:flex-end;justify-content:space-between;overflow:hidden;position:relative}.characterCopy{width:58%;position:relative;z-index:2}.characterTitle{font-size:16px;line-height:1.32;font-weight:650;color:var(--text);margin-top:8px;letter-spacing:-.01em}.characterSub{font-size:12px;line-height:1.45;color:var(--muted);margin-top:8px}.dailyCharacter{width:43%;max-height:155px;object-fit:contain;object-position:center bottom;align-self:flex-end;display:block;margin-bottom:-18px}
</style>
</head>

function lagosDateParts(date=new Date()){
  const parts=new Intl.DateTimeFormat('en-GB',{
    timeZone:'Africa/Lagos',
    year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'
  }).formatToParts(date);
  const get=type=>parts.find(p=>p.type===type)?.value||'';
  return {year:Number(get('year')),month:Number(get('month')),day:Number(get('day')),weekday:get('weekday').toUpperCase()};
}
function getDayIndex(){
  const weekday=lagosDateParts().weekday.slice(0,3);
  return {MON:0,TUE:1,WED:2,THU:3,FRI:4,SAT:5,SUN:6}[weekday];
}
function getTodayWords(){const day=getDayIndex();return [0,1,2,3,4].map(i=>ALL_WORDS[(day*5+i)%ALL_WORDS.length])}

function todayKey(){
  const d=lagosDateParts();
  return d.year+"-"+d.month+"-"+d.day;
}
function dateKeyFromUTCDate(date){
  return date.getUTCFullYear()+"-"+(date.getUTCMonth()+1)+"-"+date.getUTCDate();
}
function keyDaysAgo(daysAgo){
  const d=lagosDateParts();
  const utc=new Date(Date.UTC(d.year,d.month-1,d.day));
  utc.setUTCDate(utc.getUTCDate()-daysAgo);
  return dateKeyFromUTCDate(utc);
}
function calculateTruthStreak(){
  let streak=0;
  let offset=state.completed[todayKey()]?0:1;
  while(state.completed[keyDaysAgo(offset)]){
    streak++;
    offset++;
  }
  return streak;
}
function weekDateKey(offset){
  const d=lagosDateParts();
  const utc=new Date(Date.UTC(d.year,d.month-1,d.day));
  const mondayOffset=getDayIndex();
  utc.setUTCDate(utc.getUTCDate()-mondayOffset+offset);
  return utc.getUTCFullYear()+"-"+(utc.getUTCMonth()+1)+"-"+utc.getUTCDate();
}

}).join('')}</div>
${feedback}
${answered?`<button class="btn quizNext" data-action="quiz-next">${nextLabel} →</button>`:''}
</main></div>`;
}
function answer(i,c){
if(state.quizAnswered)return;
state.selectedAnswer=i;
state.quizAnswered=true;
if(i===c)state.quizScore++;
render();
}
function nextQuiz(){
if(!state.quizAnswered)return;
if(state.quizIndex<words.length-1){
  state.quizIndex++;
  state.quizAnswered=false;
  state.selectedAnswer=null;
  render();
}else{
  finishQuiz();
}
}
function finishQuiz(){
const key=todayKey();
state.completed[key]=true;
state.streak=calculateTruthStreak();
save();
state.screen='complete';
state.quizAnswered=false;
state.selectedAnswer=null;
render();
}
function complete(){
const score=state.quizScore;
const message=score===5
  ? 'Excellent work. You used all five words correctly.'
  : score>=3
    ? 'Good work. Review the missed words and keep practising.'
    : 'Keep going, Michael. Review today’s words and try again tomorrow.';
const icon=score===5?'✓':score>=3?'↗':'↻';
return `<div class="screen"><main style="display:flex;flex-direction:column;justify-content:center;text-align:center">
<div style="width:58px;height:58px;border-radius:50%;border:1px solid #5a4c32;background:#c9a45f12;color:var(--gold);display:grid;place-items:center;font-size:25px;margin:0 auto 16px">${icon}</div>
<h1>${score===5?'Well done, Michael.':'Lesson complete, Michael.'}</h1>
<p class="muted" style="margin-top:9px">${message}</p>
<div class="statGrid"><div class="stat"><b>5</b><span class="statLabel">Words</span></div><div class="stat"><b>${score}/5</b><span class="statLabel">Quiz</span></div><div class="stat"><b>${state.streak}</b><span class="statLabel">Streak</span></div><div class="stat"><b>10m</b><span class="statLabel">Study</span></div></div>
<button class="btn" style="margin-top:22px" data-action="home">Return home</button>
</main></div>`;
}
function review(){return `<div class="screen"><main>${pageHead('Review')}<p class="muted" style="margin-top:-8px">Review saved words and practise saying them.</p>${words.map(w=>`<div class="card" style="margin-top:10px;padding:15px"><div class="row"><div><b style="font-size:18px">${w.word}</b><div class="faint" style="font-size:11px;margin-top:3px">${w.meaning}</div></div><button class="headAction" data-say="${w.word}" data-rate=".85">🔊</button></div></div>`).join('')}</main>${bottom('review')}</div>`}
function learn(){return `<div class="screen"><main>${pageHead('Learn')}<p class="muted" style="margin-top:-8px">Search and practise today's words.</p><div style="margin-top:17px"><input id="wordSearch" placeholder="Search a word..."></div><div id="wordList" style="margin-top:12px">${words.map((w,i)=>`<button class="card learn-card" data-word="${w.word.toLowerCase()}" data-word-index="${i}" style="width:100%;margin-top:8px;padding:14px;text-align:left;color:var(--text)"><div class="row"><div><div style="font-size:16px;font-weight:600">${w.word}</div><div class="faint" style="font-size:10.5px;margin-top:3px">${w.pos} · ${w.cat}</div></div><div class="faint" style="font-size:19px">›</div></div></button>`).join('')}</div></main>${bottom('learn')}</div>`}
function filterWords(){const q=(document.getElementById('wordSearch')?.value||'').toLowerCase().trim();document.querySelectorAll('.learn-card').forEach(c=>c.style.display=c.dataset.word.includes(q)?'block':'none')}
function openWord(i){state.index=i;state.screen='word';render()}
function progress(){return `<div class="screen"><main>${pageHead('Progress')}<p class="muted" style="margin-top:-8px">Your learning activity at a glance.</p><div class="statGrid"><div class="stat"><b>142</b><span class="statLabel">Words learned</span></div><div class="stat"><b>97</b><span class="statLabel">Words mastered</span></div><div class="stat"><b>${state.streak}</b><span class="statLabel">Current streak</span></div><div class="stat"><b>91%</b><span class="statLabel">Pronunciation</span></div></div><div class="section"><div class="label">Weekly consistency</div><div class="card" style="margin-top:9px"><div class="row"><span>Lessons completed</span><b class="gold">5 / 6</b></div><div style="height:6px;background:#29282f;border-radius:99px;margin-top:13px"><div style="width:83%;height:100%;background:var(--gold);border-radius:99px"></div></div></div></div></main>${bottom('progress')}</div>`}
function menuRow(icon,title,sub,action='noop'){return `<button class="menuRow" data-menu="${action}"><span class="menuIcon">${ICON[icon]}</span><span class="menuText"><span class="menuTitle">${title}</span><span class="menuSub">${sub}</span></span><span class="chev">›</span></button>`}
function profile(){return `<div class="screen"><main>${pageHead('Profile','settings')}
<div class="profileTop"><img class="profileAvatar" src="${PROFILE_PHOTO}" alt="Michael"><div><div class="profileName">Michael</div><div class="profileRole">Lexora Learner</div><div class="profileStreak">✦ ${state.streak} DAY STREAK</div></div></div>
<div class="profileStats"><div class="pstat"><div class="picon">${ICON.book}</div><div class="pnum">30</div><div class="plabel">Words learned</div></div><div class="pstat"><div class="picon">${ICON.bookmark}</div><div class="pnum">12</div><div class="plabel">Words saved</div></div><div class="pstat"><div class="picon">${ICON.target}</div><div class="pnum">84%</div><div class="plabel">Quiz score</div></div></div>
<div class="card profileMenu">${menuRow('user','Saved Words','View your saved vocabulary','saved')}${menuRow('clock','Learning History','Review your learning activity','history')}${menuRow('target','Daily Goal','Set your daily learning goal','goal')}${menuRow('bell','Reminders','Manage your daily reminders','reminders')}${menuRow('moon','Appearance','Customize app appearance','appearance')}${menuRow('shield','Privacy','Manage your data and privacy','privacy')}</div>
<div class="card profileMenu signout">${menuRow('exit','Sign Out','Sign out of your account','signout')}</div>
</main>${bottom('profile')}</div>`}
function render(){if(state.screen==='home'||state.screen==='learn'||state.screen==='review')words=getTodayWords();let html='';if(state.screen==='home')html=home();else if(state.screen==='word')html=wordScreen();else if(state.screen==='learn')html=learn();else if(state.screen==='quiz')html=quiz();else if(state.screen==='complete')html=complete();else if(state.screen==='review')html=review();else if(state.screen==='progress')html=progress();else if(state.screen==='profile')html=profile();else html=home();document.getElementById('app').innerHTML=html;if(state.toast){document.querySelectorAll('.toast').forEach(x=>x.remove());document.body.insertAdjacentHTML('beforeend',`<div class="toast">${state.toast}</div>`)}}

document.addEventListener('click',e=>{const navBtn=e.target.closest('[data-nav]');if(navBtn){nav(navBtn.dataset.nav);return}const sayBtn=e.target.closest('[data-say]');if(sayBtn){say(sayBtn.dataset.say,Number(sayBtn.dataset.rate)||.88);return}const answerBtn=e.target.closest('[data-answer]');if(answerBtn){answer(Number(answerBtn.dataset.answer),Number(answerBtn.dataset.correct));return}const wordBtn=e.target.closest('[data-word-index]');if(wordBtn){openWord(Number(wordBtn.dataset.wordIndex));return}const action=e.target.closest('[data-action]');if(action){const a=action.dataset.action;if(a==='start')startLesson();else if(a==='home')nav('home');else if(a==='next')nextWord();else if(a==='quiz-next')nextQuiz();else if(a==='save')toggleSave();else if(a==='settings')toast('Settings are ready for the next build');return}const menu=e.target.closest('[data-menu]');if(menu){const m=menu.dataset.menu;if(m==='signout')toast('Sign out selected');else toast(menu.querySelector('.menuTitle')?.textContent+' selected');return}});
document.addEventListener('input',e=>{if(e.target.id==='wordSearch')filterWords()});
render();
</script>

</body>
</html>
