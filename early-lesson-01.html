<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>Lexora — Big feelings</title>
<style>
:root{--bg:#09090b;--surface:#121216;--surface2:#17171c;--line:#25242a;--text:#f1eee7;--muted:#9a98a0;--faint:#626067;--gold:#c9a24c;--gold2:#a9874e;--gold-pale:#e8d9b5;--green:#2e8b75;--green-deep:#1f5c4e;--danger:#e06b76}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"SF Pro Text",Inter,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}body{min-height:100dvh}.app{max-width:480px;min-height:100dvh;margin:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}button{font:inherit;border:0;color:inherit;cursor:pointer;touch-action:manipulation}.top{display:flex;align-items:center;justify-content:space-between}.back{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}.back svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.count{color:var(--muted);font-size:11px}.bar{height:4px;margin-top:20px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;width:20%;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}.lesson{flex:1;padding-top:42px}.eyebrow{color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;text-align:center}.lesson h1{margin:11px 0 0;text-align:center;font-family:"SF Pro Display",Inter,-apple-system,BlinkMacSystemFont,sans-serif;font-size:34px;line-height:1.02;letter-spacing:-.055em}.prompt{margin:11px auto 0;max-width:300px;text-align:center;color:var(--muted);font-size:14px;line-height:1.45}.listen{width:150px;height:150px;margin:34px auto 0;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(201,162,76,.35);background:radial-gradient(circle at 35% 25%,rgba(232,217,181,.18),rgba(201,162,76,.08) 45%,rgba(201,162,76,.03));box-shadow:0 20px 50px -20px rgba(201,162,76,.5)}.listen svg{width:53px;height:53px;fill:none;stroke:var(--gold-pale);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.listen:active{transform:scale(.96)}.hear{margin:15px 0 0;text-align:center;color:var(--gold-pale);font-size:13px;font-weight:650}.word{margin-top:23px;padding:18px;text-align:center;border:1px solid var(--line);border-radius:20px;background:var(--surface2)}.word b{display:block;font-family:"SF Pro Display",Inter,-apple-system,BlinkMacSystemFont,sans-serif;font-size:27px;letter-spacing:-.04em}.word span{display:block;margin-top:7px;color:var(--muted);font-size:12px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:22px}.choice{min-height:92px;border:1px solid var(--line);border-radius:18px;background:var(--surface2);font-size:31px;transition:border-color .15s,transform .15s}.choice:active{transform:scale(.97)}.choice.correct{border-color:var(--green);background:rgba(46,139,117,.16)}.choice.wrong{border-color:var(--danger);background:rgba(224,107,118,.12)}.feedback{min-height:22px;margin-top:14px;text-align:center;color:var(--muted);font-size:12px}.next{width:100%;min-height:54px;margin-top:13px;border-radius:15px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1408;font-size:15px;font-weight:700}.next.green{background:var(--green);color:#eafff8}.hidden{display:none!important}.complete{text-align:center;padding-top:90px}.complete-mark{width:82px;height:82px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#eafff8}.complete-mark svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.complete h2{margin:22px 0 8px;font-family:"SF Pro Display",Inter,-apple-system,BlinkMacSystemFont,sans-serif;font-size:30px;letter-spacing:-.05em}.complete p{margin:0 auto;max-width:290px;color:var(--muted);font-size:14px;line-height:1.5}.done{width:100%;min-height:54px;margin-top:28px;border-radius:15px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1408;font-size:15px;font-weight:700}.footer{padding-top:24px;text-align:center;color:var(--faint);font-size:10px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><div class="app"><header class="top"><button class="back" id="back" aria-label="Back to child home"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7M9 12h8"/></svg></button><span class="count" id="count">1 of 4</span></header><div class="bar"><i id="bar"></i></div><main class="lesson" id="lesson"><div class="eyebrow">Listen · 1 of 4</div><h1>Big feelings</h1><p class="prompt">Tap the sound, then say the word with me.</p><button class="listen" id="listen" aria-label="Play the word happy"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 5.8a9 9 0 0 1 0 12.4"/></svg></button><div class="hear" id="hear">Hear the word</div><div class="word"><b>Happy</b><span>Feeling good inside</span></div><div id="practice" class="hidden"><div class="choices"><button class="choice" data-answer="sad" aria-label="Sad face">😟</button><button class="choice" data-answer="happy" aria-label="Happy face">😊</button></div><div class="feedback" id="feedback">Which face feels happy?</div><button class="next hidden" id="next">Next</button></div></main><section class="complete hidden" id="complete"><div class="complete-mark"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></div><h2>Lovely listening.</h2><p>You learned <strong>happy</strong>. Your words are growing.</p><button class="done" id="done">Back to my space</button></section><footer class="footer">You can listen again anytime.</footer></div><script>const listen=document.getElementById('listen'),hear=document.getElementById('hear'),practice=document.getElementById('practice'),feedback=document.getElementById('feedback'),next=document.getElementById('next'),bar=document.getElementById('bar'),lesson=document.getElementById('lesson'),complete=document.getElementById('complete');function speak(){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Happy');u.lang='en-GB';u.rate=.75;speechSynthesis.speak(u)}hear.textContent='Listening together…';setTimeout(()=>{hear.textContent='Tap the happy face';practice.classList.remove('hidden')},700)}listen.addEventListener('click',speak);document.querySelectorAll('.choice').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.choice').forEach(x=>x.disabled=true);if(c.dataset.answer==='happy'){c.classList.add('correct');feedback.textContent='Yes — happy!';feedback.style.color='var(--green)';next.classList.remove('hidden');next.classList.add('green')}else{c.classList.add('wrong');feedback.textContent='Almost. Listen once more.';feedback.style.color='var(--danger)';document.querySelectorAll('.choice').forEach(x=>x.disabled=false)}}));next.addEventListener('click',()=>{bar.style.width='100%';lesson.classList.add('hidden');complete.classList.remove('hidden')});document.getElementById('back').addEventListener('click',()=>location.href='child-home-early.html');document.getElementById('done').addEventListener('click',()=>location.href='child-home-early.html');</script></body></html>
