<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>Lexora — Let’s play</title>
<style>
:root{--bg:#09090b;--surface:#121216;--surface2:#17171c;--line:#25242a;--text:#f1eee7;--muted:#9a98a0;--faint:#626067;--gold:#c9a24c;--gold2:#a9874e;--gold-pale:#e8d9b5;--green:#2e8b75;--green-deep:#1f5c4e;--danger:#e06b76;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"SF Pro Text",Inter,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}body{min-height:100dvh;overflow-x:hidden}button{font:inherit;border:0;color:inherit;cursor:pointer;touch-action:manipulation}.room{max-width:480px;min-height:100dvh;margin:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}.back,.sound-small{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}.back svg,.sound-small svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.step-count{color:var(--muted);font-size:11px;font-weight:650}.progress{height:5px;margin-top:17px;border-radius:99px;background:var(--line);overflow:hidden}.progress i{display:block;width:25%;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .45s var(--ease)}.scene{flex:1;padding-top:20px;display:flex;flex-direction:column;align-items:center;position:relative}.spark{position:absolute;color:var(--gold-pale);font-size:20px;animation:float 3.4s ease-in-out infinite}.spark.one{top:38px;left:8%;animation-delay:-1s}.spark.two{top:130px;right:7%;font-size:14px;animation-delay:-2.2s}.spark.three{top:240px;left:14%;font-size:12px;animation-delay:-.4s}@keyframes float{0%,100%{transform:translateY(0) rotate(0);opacity:.55}50%{transform:translateY(-10px) rotate(12deg);opacity:1}}.kicker{margin-top:5px;color:var(--gold);font-size:10px;font-weight:750;letter-spacing:.15em;text-transform:uppercase}.scene h1{margin:10px 0 0;text-align:center;font-family:"SF Pro Display",Inter,-apple-system,BlinkMacSystemFont,sans-serif;font-size:32px;line-height:1.05;letter-spacing:-.055em}.instruction{max-width:280px;margin:9px 0 0;color:var(--muted);text-align:center;font-size:13px;line-height:1.45}.guide{width:184px;height:184px;margin:25px 0 17px;position:relative;display:grid;place-items:center}.guide:before,.guide:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(201,162,76,.24);animation:ring 2.8s ease-out infinite}.guide:before{inset:5px}.guide:after{inset:-10px;animation-delay:1.1s}@keyframes ring{0%{transform:scale(.82);opacity:0}30%{opacity:.8}100%{transform:scale(1.16);opacity:0}}.character{width:126px;height:126px;border-radius:42% 58% 54% 46%/47% 42% 58% 53%;display:grid;place-items:center;position:relative;background:linear-gradient(145deg,var(--gold-pale),var(--gold));box-shadow:inset -8px -10px 0 rgba(169,135,78,.28),0 22px 32px -18px rgba(201,162,76,.75);animation:bob 3s ease-in-out infinite;transform-origin:50% 80%}@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}.face{position:relative;width:84px;height:62px}.eye{position:absolute;top:18px;width:10px;height:13px;border-radius:50%;background:#1a1408}.eye.left{left:15px}.eye.right{right:15px}.smile{position:absolute;left:29px;top:35px;width:27px;height:14px;border-bottom:3px solid #1a1408;border-radius:0 0 20px 20px}.cheek{position:absolute;top:36px;width:12px;height:7px;border-radius:50%;background:rgba(224,107,118,.45)}.cheek.left{left:3px}.cheek.right{right:3px}.star{position:absolute;top:-15px;right:-18px;color:var(--gold-pale);font-size:28px;animation:twinkle 1.7s ease-in-out infinite}@keyframes twinkle{0%,100%{transform:scale(.8) rotate(-12deg);opacity:.6}50%{transform:scale(1.12) rotate(10deg);opacity:1}}.word-card{padding:11px 20px;border:1px solid rgba(201,162,76,.26);border-radius:99px;background:rgba(201,162,76,.08);text-align:center}.word-card strong{font-family:"SF Pro Display",Inter,-apple-system,BlinkMacSystemFont,sans-serif;font-size:22px;letter-spacing:-.04em}.word-card span{display:block;margin-top:2px;color:var(--muted);font-size:10px}.audio-button{width:72px;height:72px;flex:0 0 72px;margin-top:22px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#1a1408;box-shadow:0 12px 26px -12px rgba(201,162,76,.9);transition:transform .18s var(--ease),box-shadow .18s ease}.audio-button:hover{box-shadow:0 15px 30px -10px rgba(201,162,76,.95)}.audio-button:active{transform:scale(.92)}.audio-button.playing{animation:audioPulse 1s ease-in-out infinite}@keyframes audioPulse{0%,100%{box-shadow:0 0 0 0 rgba(201,162,76,.38)}50%{box-shadow:0 0 0 14px rgba(201,162,76,0)}}.audio-button svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.audio-label{height:20px;margin-top:9px;color:var(--gold-pale);font-size:12px;font-weight:650}.choices{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:16px}.choice{min-height:104px;border:1px solid var(--line);border-radius:21px;background:var(--surface2);font-size:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:transform .18s var(--ease),border-color .18s ease,background .18s ease}.choice-icon{line-height:1}.choice-text{color:var(--muted);font-size:11px;font-weight:650}.choice:hover{transform:translateY(-3px);border-color:rgba(201,162,76,.5)}.choice:active{transform:scale(.95)}.choice.correct{border-color:var(--green);background:rgba(46,139,117,.18);animation:correct .45s var(--ease)}.choice.wrong{border-color:var(--danger);background:rgba(224,107,118,.12);animation:shake .35s ease}@keyframes correct{50%{transform:scale(1.08)}100%{transform:scale(1)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.choice-label{margin:10px 0 0;color:var(--muted);font-size:12px;text-align:center}.feedback{min-height:23px;margin-top:12px;color:var(--muted);font-size:12px;text-align:center}.retry{width:100%;min-height:48px;margin-top:8px;border:1px solid var(--line);border-radius:15px;background:var(--surface2);color:var(--muted);font-size:13px;font-weight:700}.continue{width:100%;min-height:52px;margin-top:8px;border-radius:15px;background:var(--green);color:#eafff8;font-size:14px;font-weight:700;animation:rise .35s var(--ease)}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.hidden{display:none!important}.celebrate{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:rgba(9,9,11,.94);opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease}.celebrate.open{opacity:1;visibility:visible}.celebrate-card{text-align:center}.celebrate-mark{width:104px;height:104px;margin:0 auto;border-radius:42% 58% 54% 46%;display:grid;place-items:center;background:linear-gradient(145deg,var(--green),var(--green-deep));color:#eafff8;animation:pop .55s var(--ease)}@keyframes pop{0%{transform:scale(.4) rotate(-12deg)}70%{transform:scale(1.1) rotate(5deg)}100%{transform:scale(1) rotate(0)}}.celebrate-mark svg{width:48px;height:48px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.celebrate h2{margin:22px 0 7px;font-family:"SF Pro Display",Inter,-apple-system,BlinkMacSystemFont,sans-serif;font-size:30px;letter-spacing:-.05em}.celebrate p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}.finish{width:100%;min-height:52px;margin-top:25px;border-radius:15px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1408;font-size:14px;font-weight:700}.footer{padding-top:19px;text-align:center;color:var(--faint);font-size:10px}@media(max-height:720px){.scene{padding-top:12px}.guide{margin:15px 0 12px}.guide,.character{transform:scale(.9)}.audio-button{margin-top:13px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body><div class="room"><header class="top"><button class="back" id="back" aria-label="Back to my learning space"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7M9 12h8"/></svg></button><span class="step-count" id="stepCount">1 of 4</span><button class="sound-small" id="mute" aria-label="Audio on"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button></header><div class="progress"><i id="progress"></i></div><main class="scene" id="scene"><span class="spark one">✦</span><span class="spark two">✦</span><span class="spark three">·</span><div class="kicker">Let’s discover</div><h1>Big feelings</h1><p class="instruction">Tap the sound, then find the happy face.</p><div class="guide" aria-hidden="true"><div class="character"><span class="star">✦</span><div class="face"><i class="eye left"></i><i class="eye right"></i><i class="cheek left"></i><i class="cheek right"></i><i class="smile"></i></div></div></div><div class="word-card"><strong>Happy</strong><span>feeling good inside</span></div><button class="audio-button" id="listen" aria-label="Listen to happy"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 5.8a9 9 0 0 1 0 12.4"/></svg></button><div class="audio-label" id="audioLabel">Listen</div><div class="choices hidden" id="choices"><button class="choice" data-answer="sad" aria-label="Not happy"><span class="choice-icon">☹</span><span class="choice-text">Not happy</span></button><button class="choice" data-answer="happy" aria-label="Happy"><span class="choice-icon">☺</span><span class="choice-text">Happy</span></button></div><div class="choice-label hidden" id="choiceLabel">Now choose a face</div><div class="feedback" id="feedback"></div><button class="retry hidden" id="retry">Listen again</button><button class="continue hidden" id="continue">Keep going</button></main><section class="celebrate" id="celebrate"><div class="celebrate-card"><div class="celebrate-mark"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></div><h2>Yay, you found it!</h2><p>Happy is a good feeling. Your words are growing.</p><button class="finish" id="finish">Next little game</button></div></section><footer class="footer">Grown-up settings are protected</footer></div><script src="assets/audio/early-learner-audio.js"></script><script>const audio=window.LexoraEarlyAudio;audio.preload(['word','retry','success','successSting']);const listen=document.getElementById('listen'),retry=document.getElementById('retry'),audioLabel=document.getElementById('audioLabel'),choices=document.getElementById('choices'),choiceLabel=document.getElementById('choiceLabel'),feedback=document.getElementById('feedback'),cont=document.getElementById('continue'),celebrate=document.getElementById('celebrate');let muted=false;function speak(){if(muted)return;audio.play('word');listen.classList.add('playing');audioLabel.textContent='Listening…';setTimeout(done,120)}function done(){listen.classList.remove('playing');audioLabel.textContent='Listen again';choices.classList.remove('hidden');choiceLabel.classList.remove('hidden');setTimeout(()=>choices.scrollIntoView({behavior:'smooth',block:'center'}),80)}listen.addEventListener('click',speak);document.getElementById('mute').addEventListener('click',e=>{muted=!muted;audio.setMuted(muted);e.currentTarget.setAttribute('aria-label',muted?'Audio off':'Audio on');audioLabel.textContent=muted?'Audio is off':'Listen';});document.querySelectorAll('.choice').forEach(choice=>choice.addEventListener('click',()=>{audio.playTap();document.querySelectorAll('.choice').forEach(x=>x.disabled=true);if(choice.dataset.answer==='happy'){choice.classList.add('correct');audio.play('success');audio.play('successSting');feedback.textContent='Yes! Happy!';feedback.style.color='var(--green)';cont.classList.remove('hidden')}else{choice.classList.add('wrong');audio.play('retry');feedback.textContent='Let’s listen again.';feedback.style.color='var(--danger)';setTimeout(()=>{choice.classList.remove('wrong');document.querySelectorAll('.choice').forEach(x=>x.disabled=false)},450)}}));retry.addEventListener('click',()=>{retry.classList.add('hidden');speak()});cont.addEventListener('click',()=>{document.getElementById('progress').style.width='100%';document.getElementById('stepCount').textContent='4 of 4';celebrate.classList.add('open')});document.getElementById('back').addEventListener('click',()=>location.href='child-home-early.html');document.getElementById('finish').addEventListener('click',()=>location.href='early-lesson-02.html');</script></body></html>
