<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Lexora: Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090b;
  --surface:#121216;
  --surface2:#17171c;
  --line:#25242a;
  --text:#f1eee7;
  --muted:#9a98a0;
  --faint:#626067;
  --gold:#c9a24c;
  --gold2:#a9874e;
  --gold-pale:#e8d9b5;
  --green:#2e8b75;
  --green-deep:#1f5c4e;
  --danger:#e06b76;
  --radius-xl:28px;
  --radius-lg:19px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --font-family-primary:"Inter",system-ui,sans-serif;
  --font-weight-regular:400;
  --font-weight-medium:500;
  --font-weight-semibold:600;
  --font-weight-bold:700;
  --font-weight-extrabold:800;
  --type-display-size:28px;
  --type-display-line:34px;
  --type-hero-line:30px;
  --type-hero-tracking:-.025em;
  --type-heading-size:24px;
  --type-heading-line:30px;
  --type-body-size:15px;
  --type-body-line:22px;
  --type-label-size:13px;
  --type-label-line:18px;
  --type-input-size:16px;
  --type-input-line:22px;
  --type-cta-size:15px;
  --type-cta-line:20px;
  --type-small-size:12px;
  --type-small-line:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-width:280px;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font-family-primary);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100dvh;overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation;background:none;border:0;color:inherit}
input{color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid rgba(201,162,76,.7);outline-offset:3px}
.auth-page{position:relative;min-height:100dvh;isolation:isolate;overflow:hidden;background:radial-gradient(100% 45% at 50% 0%,rgba(31,92,78,.1),transparent 72%),var(--bg)}
.auth-page::before,.auth-page::after{content:"";position:absolute;z-index:-1;border-radius:50%;pointer-events:none;filter:blur(1px)}
.auth-page::before{width:280px;height:280px;top:-190px;right:-120px;background:rgba(31,92,78,.15);filter:blur(16px)}
.auth-page::after{width:300px;height:300px;bottom:-210px;left:-150px;background:rgba(201,162,76,.08)}
.auth-shell{width:100%;max-width:560px;min-height:100dvh;margin:auto;padding:max(18px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
.brand-bar{display:flex;align-items:center;justify-content:space-between;min-height:42px}
.brand-lockup{display:inline-flex;align-items:center;gap:9px;color:var(--muted);font-size:14px;line-height:20px;font-weight:600;letter-spacing:.08em}
.brand-mark{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(145deg,var(--gold-pale),var(--gold2));color:#17130b;font-size:14px;font-weight:700;box-shadow:0 7px 22px rgba(201,162,76,.18)}
.brand-note{color:var(--faint);font-size:12px;line-height:16px;font-weight:400;letter-spacing:normal}
.auth-content{display:flex;flex:1;flex-direction:column;justify-content:center;gap:18px;padding:clamp(22px,6vh,44px) 0 12px}
.signal-panel{position:relative;min-height:0;padding:22px 20px 17px;border:1px solid rgba(201,162,76,.2);border-radius:var(--radius-xl);overflow:hidden;background:linear-gradient(145deg,rgba(23,23,28,.98),rgba(18,18,22,.88));box-shadow:0 24px 70px -42px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.05)}
.signal-panel::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 25%,rgba(232,217,181,.05) 50%,transparent 75%);transform:translateX(-100%);animation:signalSweep 8s var(--ease) infinite;pointer-events:none}
@keyframes signalSweep{55%,100%{transform:translateX(100%)}}
.signal-copy{position:relative;z-index:1;max-width:270px}
.signal-kicker{margin:0 0 9px;color:var(--gold-pale);font-size:13px;line-height:18px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.signal-title{margin:0;font-size:var(--type-display-size);line-height:var(--type-hero-line);letter-spacing:var(--type-hero-tracking);font-weight:700}
.signal-title em{color:var(--gold);font-style:normal}
.signal-subtitle{margin:11px 0 0;max-width:250px;color:var(--muted);font-size:var(--type-body-size);line-height:var(--type-body-line);font-weight:400}
.signal-art{position:relative;right:auto;bottom:auto;width:100%;height:148px;margin:8px 0 0;display:grid;place-items:center}
.signal-orbits{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orbit-ring{fill:none;transform-box:fill-box;transform-origin:center;stroke-linecap:round;stroke-dasharray:720;stroke-dashoffset:720;animation:orbitReveal 9s ease-in-out infinite}
.orbit-ring.outer{stroke:rgba(201,162,76,.34);transform:rotate(-18deg);animation-delay:.1s}
.orbit-ring.inner{stroke:rgba(46,139,117,.42);transform:rotate(28deg);animation-delay:.7s;animation-duration:8.5s}
@keyframes orbitReveal{0%{stroke-dashoffset:720;opacity:0}8%{opacity:.8}34%{stroke-dashoffset:0;opacity:.8}52%{stroke-dashoffset:0;opacity:.58}66%{stroke-dashoffset:0;opacity:.8}100%{stroke-dashoffset:720;opacity:0}}
.orbit-dot{position:absolute;z-index:2;width:8px;height:8px;border-radius:50%;background:var(--gold-pale);box-shadow:0 0 0 5px rgba(201,162,76,.1),0 0 18px rgba(201,162,76,.7);top:17px;right:calc(50% - 70px)}
.illusWrap{position:relative;z-index:1;width:145px;height:218px;animation:illusIn .7s var(--ease) both,floatCharacter 6s ease-in-out .7s infinite}
@keyframes illusIn{from{opacity:0;transform:translateY(9px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes floatCharacter{0%,100%{translate:0 0}50%{translate:0 -5px}}
.illusImg{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 24px rgba(0,0,0,.52))}
.illusImg.imgFallback{background:var(--surface2);border:1px solid var(--line);border-radius:24px;filter:none;object-fit:none}
.status-badge{position:relative;left:auto;bottom:auto;display:inline-flex;align-items:center;gap:7px;margin-top:2px;color:var(--muted);font-size:var(--type-small-size);line-height:var(--type-small-line);font-weight:400}
.status-badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(46,139,117,.12)}
.form-panel{padding:20px 16px 16px;border:1px solid var(--line);border-radius:var(--radius-xl);background:rgba(18,18,22,.88);box-shadow:0 24px 65px -45px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.035)}
.form-heading{margin:0 0 14px;font-size:var(--type-heading-size);line-height:var(--type-heading-line);letter-spacing:normal;font-weight:700}
.form-heading span{display:block;margin-top:5px;color:var(--muted);font-size:var(--type-body-size);line-height:var(--type-body-line);font-weight:400;letter-spacing:normal}
.form-heading .auth-heading-main{display:inline;margin:0;color:inherit;font-size:inherit;line-height:inherit;font-weight:inherit}
.switchTrack{position:relative;display:flex;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}
.switchSlider{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 7px 18px -8px rgba(201,162,76,.8);transition:transform .3s var(--ease)}
.switchBtn{position:relative;z-index:1;flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:var(--type-cta-size);line-height:var(--type-cta-line);font-weight:600;transition:color .2s}
.switchBtn.active{color:#1a1408}
.formZone{position:relative;padding-top:18px}
.fieldGroup{display:flex;flex-direction:column;gap:11px}
.field{display:none}.field.show{display:block;animation:fieldIn .3s var(--ease) both}
@keyframes fieldIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.fieldLabel{display:block;margin:0 2px 6px;color:var(--muted);font-size:var(--type-label-size);line-height:var(--type-label-line);font-weight:600;letter-spacing:normal}
.inputWrap{position:relative}
.inputBox{width:100%;min-height:52px;padding:0 15px;border:1px solid var(--line);border-radius:15px;background:rgba(23,23,28,.9);color:var(--text);font-size:var(--type-input-size);line-height:var(--type-input-line);font-weight:400;outline:none;transition:border-color .18s,background .18s,box-shadow .18s}
.inputBox::placeholder{color:var(--faint)}
.inputBox:hover{border-color:#3a3941}
.inputBox:focus{border-color:var(--gold2);background:var(--surface2);box-shadow:0 0 0 4px rgba(201,162,76,.13)}
.inputBox.pw{padding-right:48px}
.eyeBtn{position:absolute;right:4px;top:50%;width:42px;height:42px;display:grid;place-items:center;transform:translateY(-50%);color:var(--faint)}
.eyeBtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.forgotRow{margin-top:8px;text-align:right}.forgotLink{color:var(--gold-pale);font-size:var(--type-small-size);line-height:var(--type-small-line);font-weight:500}
.submitBtn,.socialBtn{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;min-height:54px;border-radius:15px;font-size:var(--type-cta-size);line-height:var(--type-cta-line);font-weight:600;transition:transform .15s,filter .15s,border-color .15s,background .15s}
.submitBtn{margin-top:18px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1408;box-shadow:0 12px 28px -13px rgba(201,162,76,.9)}
.submitBtn:active,.socialBtn:active{transform:scale(.985)}
.submitBtn:hover{filter:brightness(1.06)}
.submitBtn:disabled{opacity:.62;cursor:wait}
.dividerRow{display:flex;align-items:center;gap:11px;margin:18px 0}.dividerLine{height:1px;flex:1;background:var(--line)}.dividerText{color:var(--faint);font-size:var(--type-small-size);line-height:var(--type-small-line);font-weight:500;letter-spacing:.08em}
.socialBtn{border:1px solid var(--line);background:var(--surface2);color:var(--text);font-weight:600}.socialBtn:hover{border-color:rgba(201,162,76,.48);background:#1b1b21}.socialBtn svg{width:18px;height:18px}
.status{min-height:20px;margin:11px 2px 0;color:var(--muted);font-size:var(--type-small-size);line-height:var(--type-small-line);font-weight:400;text-align:center}.status:not(:empty){padding:9px 10px;border:1px solid rgba(201,162,76,.2);border-radius:11px;background:rgba(201,162,76,.06)}
.footNote{margin:16px 10px 0;color:var(--faint);font-size:var(--type-small-size);line-height:var(--type-small-line);font-weight:400;text-align:center}.footNote b{color:var(--muted);font-weight:500}
@media (min-width:600px) and (max-width:1199px){
  .auth-shell{max-width:900px;padding-left:clamp(28px,6vw,72px);padding-right:clamp(28px,6vw,72px)}
  .auth-content{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(20px,4vw,52px);padding-top:clamp(34px,7vh,78px)}
  .signal-panel{min-height:clamp(380px,45vw,450px);padding:clamp(24px,4vw,42px)}
  .signal-copy{max-width:50%}
  .signal-subtitle{max-width:245px}
  .signal-art{position:absolute;right:-3%;bottom:-12px;width:49%;height:100%;margin:0}
  .signal-art::before{width:155px;height:205px}
  .signal-art::after{width:185px;height:120px;border-color:rgba(201,162,76,.2)}
  .illusWrap{width:clamp(150px,22vw,220px);height:clamp(225px,33vw,330px)}
  .status-badge{position:absolute;left:clamp(24px,4vw,42px);bottom:clamp(20px,3vw,32px);margin:0}
  .form-panel{padding:clamp(22px,3vw,34px)}
  .inputBox{min-height:clamp(52px,6vw,60px)}
  .submitBtn,.socialBtn{min-height:clamp(54px,6vw,62px)}
}
@media (max-height:620px) and (orientation:landscape) and (max-width:1199px){.auth-content{padding-top:18px}.signal-panel{min-height:260px}.auth-shell{padding-top:12px;padding-bottom:14px}.brand-note{display:none}}
@media (max-width:599px){
  .signal-panel{min-height:clamp(260px,73vw,285px);padding:22px 28px 18px}
  .signal-copy{position:absolute;left:28px;top:46%;width:210px;max-width:calc(100% - 60px);z-index:2;transform:translateY(-50%)}
  .signal-title{margin-top:11px}
  .signal-subtitle{max-width:230px;font-size:14px;line-height:20px}
  .signal-art{position:absolute;right:-12%;bottom:8px;width:57%;height:100%;margin:0;place-items:center}
  .signal-orbits{transform:translateX(20px)}
  .orbit-dot{top:13%;right:31%}
  .signal-orbits{width:190px;height:255px}
  .illusWrap{width:clamp(128px,35vw,145px);height:clamp(190px,50vw,210px)}
  .status-badge{position:absolute;left:28px;bottom:16px;margin:0;font-size:10px;line-height:14px}
  .form-heading{font-size:20px;line-height:26px}
  .form-heading span{font-size:14px;line-height:20px}
  .form-heading.signup-mode{font-size:18px;line-height:24px}
  .footNote{margin-left:0;margin-right:0;font-size:10px;line-height:14px;letter-spacing:-.02em;white-space:nowrap}
}
@media (max-width:380px){
  .auth-shell{padding-left:14px;padding-right:14px}
  .signal-panel{min-height:260px;padding:21px 16px 18px}
  .signal-copy{left:16px;max-width:calc(100% - 44px)}
  .signal-art{right:-12%;bottom:5px;width:58%;height:100%}
  .signal-orbits{transform:translateX(18px)}
  .orbit-dot{top:13%;right:29%}
  .signal-orbits{width:165px;height:230px}
  .illusWrap{width:122px;height:184px}
  .status-badge{left:16px;bottom:16px;font-size:10px;line-height:14px}
  .form-panel{padding:16px 13px 14px}
  .inputBox{min-height:50px}
  .submitBtn,.socialBtn{min-height:52px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="auth-page">
  <div class="auth-shell">
    <header class="brand-bar">
      <div class="brand-lockup"><span class="brand-mark" aria-hidden="true">L</span><span>LEXORA</span></div>
      <span class="brand-note">A little progress, every day</span>
    </header>
    <main class="auth-content">
      <section class="signal-panel" aria-label="Lexora introduction">
        <div class="signal-copy">
          <h1 class="signal-title">Keep learning. <em>Keep growing.</em></h1>
          <p class="signal-subtitle" id="tagline">A calm place to build language, confidence, and momentum.</p>
        </div>
        <div class="signal-art" aria-hidden="true">
          <svg class="signal-orbits" viewBox="0 0 200 280" preserveAspectRatio="xMidYMid meet">
            <ellipse class="orbit-ring outer" cx="100" cy="140" rx="70" ry="112"></ellipse>
            <ellipse class="orbit-ring inner" cx="100" cy="140" rx="88" ry="62"></ellipse>
          </svg>
          <span class="orbit-dot"></span>
          <div class="illusWrap"><img class="illusImg" alt="Lexora character in Ankara-print top, waving in greeting" src="assets/characters/auth-01.png" onerror="this.classList.add('imgFallback');this.removeAttribute('src')"></div>
        </div>
        <span class="status-badge">Built for every kind of learner</span>
      </section>
      <section class="form-panel" aria-labelledby="authTitle">
        <h2 class="form-heading" id="authTitle"><span class="auth-heading-main" id="authHeading">Welcome back</span><span id="authSubtitle">Pick up where you left off.</span></h2>
        <div class="switchTrack">
          <div class="switchSlider" id="switchSlider"></div>
          <button class="switchBtn active" id="loginTab" type="button">Log in</button>
          <button class="switchBtn" id="signupTab" type="button">Sign up</button>
        </div>
        <div class="formZone">
          <div class="fieldGroup">
            <div class="field" id="nameField"><label class="fieldLabel" for="nameInput">Full name</label><div class="inputWrap"><input class="inputBox" id="nameInput" type="text" placeholder="Michael O." autocomplete="name"></div></div>
            <div class="field show" id="emailField"><label class="fieldLabel" for="emailInput">Email</label><div class="inputWrap"><input class="inputBox" id="emailInput" type="email" placeholder="you@email.com" autocomplete="email"></div></div>
            <div class="field show" id="pwField"><label class="fieldLabel" for="pwInput">Password</label><div class="inputWrap"><input class="inputBox pw" type="password" placeholder="Enter your password" id="pwInput" autocomplete="current-password"><button class="eyeBtn" id="eyeBtn" type="button" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
          </div>
          <div class="forgotRow" id="forgotRow"><button class="forgotLink" type="button">Forgot password?</button></div>
          <button class="submitBtn" id="submitBtn" type="button">Log in</button>
          <div class="status" id="status" role="status" aria-live="polite"></div>
          <div class="dividerRow"><span class="dividerLine"></span><span class="dividerText">OR</span><span class="dividerLine"></span></div>
          <button class="socialBtn" id="googleBtn" type="button"><svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.4-1.7 4.1-5.5 4.1-3.3 0-6-2.7-6-6.2s2.7-6.2 6-6.2c1.9 0 3.1.8 3.9 1.5l2.6-2.5C16.9 3.2 14.7 2.2 12 2.2 6.9 2.2 2.7 6.4 2.7 12s4.2 9.8 9.3 9.8c5.4 0 8.9-3.8 8.9-9.1 0-.6-.07-1.1-.16-1.6H12z"/></svg>Continue with Google</button>
        </div>
      </section>
    </main>
    <p class="footNote" id="footNote">By continuing, you agree to our <b>Terms</b> and <b>Privacy Policy</b>.</p>
  </div>
</div>
<script>
var API_BASE = 'https://lexora-web.onrender.com';
var loginTab = document.getElementById('loginTab');
var signupTab = document.getElementById('signupTab');
var switchSlider = document.getElementById('switchSlider');
var nameField = document.getElementById('nameField');
var forgotRow = document.getElementById('forgotRow');
var submitBtn = document.getElementById('submitBtn');
var tagline = document.getElementById('tagline');
var authHeading = document.getElementById('authHeading');
var authSubtitle = document.getElementById('authSubtitle');
var nameInput = document.getElementById('nameInput');
var emailInput = document.getElementById('emailInput');
var pwInput = document.getElementById('pwInput');
var statusEl = document.getElementById('status');
var googleBtn = document.getElementById('googleBtn');
var authTitle = document.getElementById('authTitle');
var mode = 'login';
function setMode(nextMode){
  mode = nextMode;
  var isLogin = mode === 'login';
  loginTab.classList.toggle('active', isLogin);
  signupTab.classList.toggle('active', !isLogin);
  switchSlider.style.transform = isLogin ? 'translateX(0)' : 'translateX(100%)';
  nameField.classList.toggle('show', !isLogin);
  forgotRow.style.display = isLogin ? 'block' : 'none';
  submitBtn.textContent = isLogin ? 'Log in' : 'Create account';
  authTitle.classList.toggle('signup-mode', !isLogin);
  authHeading.textContent = isLogin ? 'Welcome back' : 'Start your Lexora journey';
  authSubtitle.textContent = isLogin ? 'Pick up where you left off.' : 'Start small and build a habit that lasts.';
  tagline.textContent = 'A calm place to build language, confidence, and momentum.';
  pwInput.autocomplete = isLogin ? 'current-password' : 'new-password';
  statusEl.textContent = '';
}
function setStatus(message){ statusEl.textContent = message || ''; }
var oauthError = new URLSearchParams(window.location.search).get('oauth_error');
if(oauthError === 'google_email_exists') setStatus('That Google email already has a Lexora password account. Please log in with your existing password.');
else if(oauthError === 'google_cancelled') setStatus('Google sign-in was cancelled.');
else if(oauthError) setStatus('Google sign-in could not be completed. Please try again.');
async function submitAuth(){
  var email = emailInput.value.trim();
  var password = pwInput.value;
  var displayName = nameInput.value.trim();
  if(!email || !password || (mode === 'signup' && !displayName)){
    setStatus(mode === 'signup' ? 'Please enter your name, email and password.' : 'Please enter your email and password.');
    return;
  }
  submitBtn.disabled = true;
  setStatus(mode === 'signup' ? 'Creating your account...' : 'Signing you in...');
  var endpoint = mode === 'signup' ? '/v1/auth/signup' : '/v1/auth/login';
  var body = mode === 'signup' ? { email: email, password: password, displayName: displayName } : { email: email, password: password };
  try {
    var response = await fetch(API_BASE + endpoint, { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    var data = await response.json().catch(function(){ return {}; });
    if(!response.ok){
      if(data.error === 'account_unavailable') throw new Error('An account with this email already exists. Please log in instead.');
      if(data.error === 'invalid_request') throw new Error('Please use a valid email and a password with at least 12 characters, including upper case, lower case and a number.');
      throw new Error('Authentication could not be completed. Please try again.');
    }
    setStatus(mode === 'signup' ? 'Account created. Opening Lexora...' : 'Signed in. Opening Lexora...');
    window.location.href = 'profile-picker.html';
  } catch(error){ setStatus(error.message || 'Something went wrong. Please try again.'); }
  finally { submitBtn.disabled = false; }
}
loginTab.addEventListener('click', function(){ setMode('login'); });
signupTab.addEventListener('click', function(){ setMode('signup'); });
submitBtn.addEventListener('click', submitAuth);
googleBtn.addEventListener('click', function(){ window.location.href = API_BASE + '/v1/auth/google'; });
[emailInput, pwInput, nameInput].forEach(function(input){ input.addEventListener('keydown', function(event){ if(event.key === 'Enter') submitAuth(); }); });
