<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0b0e">
<title>Lexora — Updates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0e;--panel:#111318;--panel-soft:#15171d;--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.15);--text:#f6f3ec;--muted:#94959d;--dim:#696b73;--gold:#d2ad6f;--gold-bright:#edc984;--gold-wash:rgba(210,173,111,.11);--green:#8fc69c;--danger:#ff9b91}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}body{min-height:100dvh;overflow-x:hidden;background:radial-gradient(ellipse 90% 42% at 50% -8%,rgba(225,188,116,.13),transparent 68%),var(--bg)}button{font:inherit;cursor:pointer;touch-action:manipulation;background:none;border:0;color:inherit}button:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px}
#app{min-height:100dvh;max-width:560px;margin:auto;display:flex;flex-direction:column;position:relative;z-index:1}.topbar{height:72px;padding:17px 22px 13px;display:flex;align-items:center;justify-content:space-between}.backBtn{width:40px;height:40px;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;color:#f1eee7;background:rgba(255,255,255,.025);transition:background .2s,border-color .2s,transform .2s}.backBtn:hover{background:rgba(255,255,255,.07);border-color:var(--line-strong)}.backBtn:active{transform:scale(.94)}.backBtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.topbarTitle{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.topbarSpacer{width:40px}
.main{padding:38px 22px 132px}.eyebrow{margin:0 0 10px;color:var(--gold);font-size:12px;line-height:18px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.title{max-width:420px;margin:0;font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.045em}.intro{max-width:390px;margin:12px 0 0;color:var(--muted);font-size:15px;line-height:21px;font-weight:400}.updateCard{margin-top:30px;padding:22px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(155deg,rgba(24,25,30,.92),rgba(14,15,19,.9));box-shadow:0 18px 44px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.035)}.stateHeader{display:flex;align-items:center;gap:13px}.stateIcon{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border:1px solid rgba(143,198,156,.2);border-radius:14px;color:var(--green);background:rgba(143,198,156,.1)}.stateIcon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.stateEyebrow{color:var(--green);font-size:11px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.stateTitle{margin:2px 0 0;font-size:20px;line-height:26px;font-weight:700;letter-spacing:-.025em}.stateCopy{max-width:370px;margin:18px 0 0;color:var(--muted);font-size:15px;line-height:22px;font-weight:400}.versionGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.versionCell{padding:12px 13px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.025)}.versionLabel{display:block;color:var(--dim);font-size:11px;line-height:16px;font-weight:500}.versionValue{display:block;margin-top:4px;color:var(--text);font-size:15px;line-height:20px;font-weight:600}.meta{margin:16px 0 0;color:var(--dim);font-size:12px;line-height:18px}.releaseNotes{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.releaseNotes h2{margin:0;font-size:16px;line-height:22px;font-weight:600}.releaseNotes ul{margin:10px 0 0;padding-left:19px;color:var(--muted);font-size:14px;line-height:21px}.action{width:100%;min-height:46px;margin-top:22px;border-radius:14px;color:#17130b;background:linear-gradient(135deg,#f0d795,#c39a43);font-size:14px;font-weight:600}.action:disabled{cursor:not-allowed;color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.06);opacity:.78}.secondary{color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.045)}.error .stateIcon{color:var(--danger);border-color:rgba(255,155,145,.2);background:rgba(255,155,145,.1)}.error .stateEyebrow{color:var(--danger)}.success .stateIcon{color:var(--green)}.navBar{position:fixed;bottom:0;left:50%;width:min(560px,100%);transform:translateX(-50%);display:flex;border-top:1px solid var(--line);background:rgba(10,11,14,.88);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding:11px 8px calc(11px + env(safe-area-inset-bottom));z-index:5}.navItem{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--dim);font-size:10px;line-height:14px;font-weight:600;padding:4px 0;transition:transform .15s,color .15s}.navItem:active{transform:scale(.92)}.navItem svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.navItem.active{color:var(--gold-bright)}
@media(max-width:380px){.main{padding:30px 17px 132px}.title{font-size:26px;line-height:32px}.intro{font-size:14px;line-height:20px}.updateCard{margin-top:24px;padding:18px}.stateTitle{font-size:19px;line-height:25px}.stateCopy{font-size:14px;line-height:20px}.versionGrid{gap:8px}.versionCell{padding:11px}.versionValue{font-size:14px}}
</style>
</head>
<body>
<div id="app">
<header class="topbar"><button class="backBtn" id="backBtn" aria-label="Back to Profile"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button><div class="topbarTitle">Updates</div><div class="topbarSpacer"></div></header>
<main class="main" aria-live="polite"><p class="eyebrow">Lexora improvements</p><h1 class="title">Keep Lexora up to date.</h1><p class="intro">Check for the latest improvements. Your learning and progress stay exactly where you left them.</p><section class="updateCard" id="updateCard"><div class="stateHeader"><div class="stateIcon" id="stateIcon"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></div><div><div class="stateEyebrow" id="stateEyebrow">Checking now</div><h2 class="stateTitle" id="stateTitle">Looking for improvements</h2></div></div><p class="stateCopy" id="stateCopy">We’re checking the latest Lexora version for you.</p><div id="stateDetails"></div></section></main>
<nav class="navBar"><button class="navItem" data-route="home.html"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</button><button class="navItem" data-route="learn.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Learn</button><button class="navItem" data-route="review.html"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 12V6"/><path d="M3 12h6"/></svg>Review</button><button class="navItem" data-route="progress.html"><svg viewBox="0 0 24 24"><path d="M5 20V11"/><path d="M12 20V4"/><path d="M19 20v-7"/></svg>Progress</button><button class="navItem active" data-route="profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Profile</button></nav>
</div>
<script>
(function(){
  var card=document.getElementById('updateCard'),title=document.getElementById('stateTitle'),copy=document.getElementById('stateCopy'),details=document.getElementById('stateDetails'),icon=document.getElementById('stateIcon'),eyebrow=document.getElementById('stateEyebrow');
  function versionParts(v){return String(v||'0').split('.').map(function(part){var n=parseInt(part,10);return Number.isFinite(n)?n:0;});}
  function newer(a,b){var left=versionParts(a),right=versionParts(b);for(var i=0;i<3;i++){if((left[i]||0)!==(right[i]||0))return (left[i]||0)>(right[i]||0);}return false;}
  function setState(state,data){card.className='updateCard '+state;details.innerHTML='';if(state==='success'){eyebrow.textContent='All clear';title.textContent='You’re up to date';copy.textContent='Everything is current. Keep learning with the latest Lexora experience.';icon.innerHTML='<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>';details.innerHTML='<div class="versionGrid"><div class="versionCell"><span class="versionLabel">Current version</span><span class="versionValue">'+data.currentVersion+'</span></div><div class="versionCell"><span class="versionLabel">Last checked</span><span class="versionValue">Just now</span></div></div>';return;}if(state==='available'){eyebrow.textContent='New release';title.textContent='An update is ready';copy.textContent='A newer Lexora experience is available to review. Your current learning space remains safe and available.';icon.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';var notes=(data.notes||[]).map(function(note){return '<li>'+note+'</li>';}).join('');details.innerHTML='<div class="versionGrid"><div class="versionCell"><span class="versionLabel">Current version</span><span class="versionValue">'+data.currentVersion+'</span></div><div class="versionCell"><span class="versionLabel">New version</span><span class="versionValue">'+data.latestVersion+'</span></div></div><div class="releaseNotes"><h2>What’s improved</h2><ul>'+notes+'</ul></div><button class="action" id="updateBtn" type="button" disabled aria-disabled="true">Installation coming soon</button><p class="meta">You can review this release now. Installation will be available when update support is connected.</p>';return;}eyebrow.textContent='Connection issue';title.textContent='We couldn’t check just now';copy.textContent='Your current Lexora experience is safe. Try again when you’re ready.';icon.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 8v4"/><path d="M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg>';details.innerHTML='<button class="action secondary" id="retryBtn" type="button">Try again</button>';document.getElementById('retryBtn').addEventListener('click',check);}
  function check(){setState('checking',{});fetch('version.json?check='+Date.now(),{cache:'no-store'}).then(function(response){if(!response.ok)throw new Error('version_unavailable');return response.json();}).then(function(data){if(!data.currentVersion||!data.latestVersion)throw new Error('version_invalid');setState(newer(data.latestVersion,data.currentVersion)?'available':'success',data);}).catch(function(){setState('error',{});});}
  document.getElementById('backBtn').addEventListener('click',function(){window.location.href='profile.html';});document.querySelectorAll('[data-route]').forEach(function(btn){btn.addEventListener('click',function(){window.location.href=btn.dataset.route;});});check();
})();
</script>
</body>
</html>
