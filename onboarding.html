<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#09090b">
<title>Lexora: Welcome</title>
<style>
:root{
  --bg:#09090b;
  --surface:#121216;
  --surface2:#17171c;
  --line:#25242a;
  --text:#f1eee7;
  --muted:#9a98a0;
  --faint:#666469;
  --gold:#c9a24c;
  --gold2:#a9874e;
  --gold-pale:#e8d9b5;
  --green:#2e8b75;
  --green-pale:#7fd6b8;
  --skin:#8a5a3c;
  --skin2:#6e4530;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
body{min-height:100dvh}
button{font:inherit;cursor:pointer;touch-action:manipulation;background:none;border:0;color:inherit}
#app{height:100dvh;min-height:100dvh;max-width:480px;margin:auto;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}

.skipBtn{position:absolute;top:20px;right:20px;z-index:20;min-height:36px;padding:0 16px;border-radius:100px;
  background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:650;
  backdrop-filter:blur(6px);transition:border-color .15s}
.skipBtn:active{border-color:var(--gold2)}

.track{flex:1;display:flex;transition:transform .45s cubic-bezier(.2,.8,.2,1);height:100%;min-height:0}
.slide{flex:0 0 100%;display:flex;flex-direction:column;padding:76px 28px 0;text-align:left;position:relative;min-height:0}

.ambient{position:absolute;top:0;left:0;right:0;height:68%;pointer-events:none;transition:opacity .4s}
.amb-gold{background:radial-gradient(circle at 50% 8%,rgba(201,162,76,.32),transparent 62%)}
.amb-green{background:radial-gradient(circle at 50% 8%,rgba(46,139,117,.32),transparent 62%)}

/* Heading + subtitle now read as one flowing block: no connector bar, tight leading */
.slideHead{max-width:320px;animation:riseIn .5s cubic-bezier(.2,.7,.2,1) both}
.slideHead .line1{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--text)}
.slideHead .line2{margin-top:6px;font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.35;color:var(--gold-pale)}

.visualZone{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;margin-top:6px;position:relative;
  animation:riseIn .6s cubic-bezier(.16,1,.3,1) .1s both}

.charIllus{width:auto;height:100%;max-height:520px;max-width:92%;object-fit:contain;object-position:bottom center;
  filter:drop-shadow(0 24px 40px rgba(0,0,0,.5))}
.charIllus.imgFallback{width:70%;max-width:280px;height:60%;max-height:340px;background:var(--surface2);
  border:1px solid var(--line);border-radius:24px;filter:none;object-fit:none}

@keyframes riseIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

.footer{position:relative;padding:16px 24px calc(24px + env(safe-area-inset-bottom));z-index:5}
.dots{display:flex;justify-content:center;gap:7px;margin-bottom:20px}
.dot{width:7px;height:7px;border-radius:4px;background:var(--line);transition:width .3s,background .3s}
.dot.active{width:22px;background:linear-gradient(90deg,var(--gold),var(--gold2))}

.navRow{display:flex;align-items:center;gap:12px}
.nextBtn{flex:1;min-height:56px;border-radius:16px;font-size:16px;font-weight:700;letter-spacing:-.01em;
  display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1408;
  box-shadow:0 10px 26px -10px rgba(201,162,76,.55);transition:transform .12s,filter .12s}
.nextBtn:active{transform:scale(.98);filter:brightness(.95)}
.nextBtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.nextBtn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(115deg,transparent,rgba(255,255,255,.5),transparent);
  animation:ctaSweep 3.4s ease-in-out .9s infinite}
@keyframes ctaSweep{0%{left:-60%}22%{left:130%}100%{left:130%}}

@media(prefers-reduced-motion:reduce){
  .slideHead,.visualZone{animation:none}
  .nextBtn::after{animation:none}
  .track{transition:none}
}
@media(max-height:700px){
  .slide{padding-top:64px}
  .slideHead .line1{font-size:27px}
  .slideHead .line2{font-size:16px}
  .visualZone{margin-top:4px}
}
</style>
</head>
<body>
<div id="app">
  <button class="skipBtn" id="skipBtn">Skip</button>

  <div class="ambient amb-gold" id="ambient"></div>

  <div class="track" id="track">

    <div class="slide">
      <div class="slideHead">
        <div class="line1">Words that open doors.</div>
        <div class="line2">Five a day, every day.</div>
      </div>
      <div class="visualZone">
        <img class="charIllus" alt="Lexora character, warm open-handed welcome gesture, face to chest" src="assets/characters/onboarding-01.webp" onerror="this.classList.add('imgFallback');this.removeAttribute('src')">
      </div>
    </div>

    <div class="slide">
      <div class="slideHead">
        <div class="line1">Hear it. Say it right.</div>
        <div class="line2">Native pace, or slowed right down.</div>
      </div>
      <div class="visualZone">
        <img class="charIllus" alt="Lexora character with headphones, speaking into phone, face to chest" src="assets/characters/onboarding-02.webp" onerror="this.classList.add('imgFallback');this.removeAttribute('src')">
      </div>
    </div>

    <div class="slide">
      <div class="slideHead">
        <div class="line1">Know what you know.</div>
        <div class="line2">Mastery, tracked word by word.</div>
      </div>
      <div class="visualZone">
        <img class="charIllus" alt="Lexora character reviewing progress on a tablet, face to chest" src="assets/characters/onboarding-03.webp" onerror="this.classList.add('imgFallback');this.removeAttribute('src')">
      </div>
    </div>

    <div class="slide">
      <div class="slideHead">
        <div class="line1">Small steps to fluency.</div>
        <div class="line2">Five minutes. Most days.</div>
      </div>
      <div class="visualZone">
        <img class="charIllus" style="max-height:420px" alt="Lexora character walking forward mid-stride, full figure" src="assets/characters/onboarding-04.webp" onerror="this.classList.add('imgFallback');this.removeAttribute('src')">
      </div>
    </div>

  </div>

  <div class="footer">
    <div class="dots" id="dots">
      <span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="navRow">
      <button class="nextBtn" id="nextBtn">Continue <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button>
    </div>
  </div>
</div>

<script>
var track = document.getElementById('track');
var dots = document.querySelectorAll('.dot');
var nextBtn = document.getElementById('nextBtn');
var skipBtn = document.getElementById('skipBtn');
var ambient = document.getElementById('ambient');
var total = 4;
var idx = 0;
var ambClasses = ['amb-gold','amb-green','amb-gold','amb-green'];

function render(){
  track.style.transform = 'translateX(-' + (idx * 100) + '%)';
  dots.forEach(function(d,i){ d.classList.toggle('active', i === idx); });
  ambient.className = 'ambient ' + ambClasses[idx];
  if(idx === total - 1){
    nextBtn.innerHTML = 'Get started <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>';
    skipBtn.style.display = 'none';
  } else {
    nextBtn.innerHTML = 'Continue <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>';
    skipBtn.style.display = 'block';
  }
}

function goToAuth(){
  // In the real app: navigate to the login/sign up screen here.
  window.location.href = 'auth.html';
}

nextBtn.addEventListener('click', function(){
  if(idx < total - 1){ idx++; render(); }
  else { goToAuth(); }
});
skipBtn.addEventListener('click', goToAuth);
dots.forEach(function(d, i){
  d.style.cursor = 'pointer';
});

var startX = null;
track.addEventListener('touchstart', function(e){ startX = e.touches[0].clientX; }, {passive:true});
track.addEventListener('touchend', function(e){
  if(startX === null) return;
  var dx = e.changedTouches[0].clientX - startX;
  if(dx < -40 && idx < total - 1){ idx++; render(); }
  else if(dx > 40 && idx > 0){ idx--; render(); }
  startX = null;
}, {passive:true});

render();
</script>
</body>
</html>
