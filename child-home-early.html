<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>Lexora — Let’s play</title>
<style>
:root{--bg:#09090b;--surface:#121216;--surface2:#17171c;--line:#25242a;--text:#f1eee7;--muted:#9a98a0;--faint:#626067;--gold:#c9a24c;--gold2:#a9874e;--gold-pale:#e8d9b5;--green:#2e8b75;--green-deep:#1f5c4e;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"SF Pro Text",Inter,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}body{min-height:100dvh;overflow-x:hidden}button{font:inherit;border:0;color:inherit;cursor:pointer;touch-action:manipulation}.app{max-width:480px;min-height:100dvh;margin:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}.switch{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}.switch svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.profile{display:flex;align-items:center;gap:8px;color:var(--text);font-size:13px;font-weight:650}.avatar{width:36px;height:36px;flex:0 0 36px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold-pale);background:linear-gradient(145deg,#302819,#15130f);font-size:14px;font-weight:750}.spark{position:absolute;color:var(--gold-pale);font-size:18px;animation:float 3s ease-in-out infinite}.spark.one{top:96px;left:12%;animation-delay:-1s}.spark.two{top:170px;right:10%;font-size:13px;animation-delay:-2s}.spark.three{top:315px;left:18%;font-size:11px;animation-delay:-.4s}@keyframes float{0%,100%{transform:translateY(0) rotate(0);opacity:.5}50%{transform:translateY(-10px) rotate(12deg);opacity:1}}main{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:33px}.kicker{color:var(--gold);font-size:10px;font-weight:750;letter-spacing:.15em;text-transform:uppercase}.hero{text-align:center}.hero h1{margin:11px 0 0;font-family:"SF Pro Display",Inter,-apple-system,BlinkMacSystemFont,sans-serif;font-size:36px;line-height:1.02;letter-spacing:-.06em}.hero p{max-width:280px;margin:10px auto 0;color:var(--muted);font-size:14px;line-height:1.45}.guide{width:190px;height:190px;margin:31px auto 0;position:relative;display:grid;place-items:center}.guide:before,.guide:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(201,162,76,.24);animation:ring 2.8s ease-out infinite}.guide:before{inset:5px}.guide:after{inset:-10px;animation-delay:1.1s}@keyframes ring{0%{transform:scale(.82);opacity:0}30%{opacity:.8}100%{transform:scale(1.16);opacity:0}}.character{width:130px;height:130px;border-radius:42% 58% 54% 46%/47% 42% 58% 53%;display:grid;place-items:center;position:relative;background:linear-gradient(145deg,var(--gold-pale),var(--gold));box-shadow:inset -8px -10px 0 rgba(169,135,78,.28),0 22px 32px -18px rgba(201,162,76,.75);animation:bob 3s ease-in-out infinite;transform-origin:50% 80%}@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}.face{position:relative;width:84px;height:62px}.eye{position:absolute;top:18px;width:10px;height:13px;border-radius:50%;background:#1a1408}.eye.left{left:15px}.eye.right{right:15px}.smile{position:absolute;left:29px;top:35px;width:27px;height:14px;border-bottom:3px solid #1a1408;border-radius:0 0 20px 20px}.cheek{position:absolute;top:36px;width:12px;height:7px;border-radius:50%;background:rgba(224,107,118,.45)}.cheek.left{left:3px}.cheek.right{right:3px}.star{position:absolute;top:-24px;right:-19px;color:var(--gold-pale);font-size:28px;animation:twinkle 1.7s ease-in-out infinite}@keyframes twinkle{0%,100%{transform:scale(.8) rotate(-12deg);opacity:.6}50%{transform:scale(1.12) rotate(10deg);opacity:1}}.lesson-invite{width:100%;margin-top:26px;padding:18px;border:1px solid var(--line);border-radius:23px;background:var(--surface2);text-align:center}.lesson-invite strong{display:block;font-family:"SF Pro Display",Inter,-apple-system,BlinkMacSystemFont,sans-serif;font-size:21px;letter-spacing:-.04em}.lesson-invite span{display:block;margin-top:6px;color:var(--muted);font-size:12px}.play{width:100%;min-height:56px;margin-top:16px;border-radius:16px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1408;font-size:15px;font-weight:750;box-shadow:0 13px 28px -17px rgba(201,162,76,.95);transition:transform .18s var(--ease),filter .18s ease}.play:active{transform:scale(.98)}.mini-reward{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;color:var(--gold-pale);font-size:12px}.mini-reward b{color:var(--gold)}.dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(201,162,76,.12)}.footer{margin-top:auto;padding-top:23px;text-align:center;color:var(--faint);font-size:10px}.footer svg{width:13px;height:13px;vertical-align:-3px;margin-right:4px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}@media(max-height:720px){main{padding-top:18px}.guide{margin-top:18px;transform:scale(.86)}.lesson-invite{margin-top:12px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body><div class="app"><span class="spark one">✦</span><span class="spark two">✦</span><span class="spark three">·</span><header class="top"><button class="switch" id="switch" aria-label="Switch profile"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7M9 12h8"/></svg></button><div class="profile"><span id="childName">Gracefilled</span><span class="avatar" id="avatar">G</span></div></header><main><section class="hero"><div class="kicker">Let’s play</div><h1>Ready for a little adventure?</h1><p>Listen, tap, and discover a new word.</p></section><div class="guide" aria-hidden="true"><div class="character"><span class="star">✦</span><div class="face"><i class="eye left"></i><i class="eye right"></i><i class="cheek left"></i><i class="cheek right"></i><i class="smile"></i></div></div></div><section class="lesson-invite"><strong>Big feelings</strong><span>A tiny lesson about feeling happy</span><button class="play" id="start">Let’s start</button></section><div class="mini-reward"><span class="dot"></span><span><b>2 little days</b> of learning</span></div></main><footer class="footer"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Grown-up settings are protected</footer></div><script>const selected=sessionStorage.getItem('lexoraSelectedProfile');document.getElementById('childName').textContent=selected||'Gracefilled';document.getElementById('avatar').textContent=(selected||'Gracefilled').charAt(0).toUpperCase();document.getElementById('start').addEventListener('click',()=>location.href='early-lesson-01.html');document.getElementById('switch').addEventListener('click',()=>location.href='profile-picker.html');</script></body></html>
