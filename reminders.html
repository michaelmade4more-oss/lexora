<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#09090b">
<title>Lexora: Reminders</title>
<style>
:root{
  --bg:#09090b;
  --surface:#121216;
  --surface2:#17171c;
  --line:#25242a;
  --text:#f1eee7;
  --muted:#9a98a0;
  --faint:#626067;
  --gold:#c9a24c;
  --gold2:#a9874e;
  --gold-pale:#e8d9b5;
  --green:#2e8b75;
  --green-pale:#7fd6b8;
  --shadow-card:0 24px 50px -28px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.03);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100dvh;overflow-x:hidden}
button{font:inherit;cursor:pointer;touch-action:manipulation;background:none;border:0;color:inherit}
#app{min-height:100dvh;max-width:480px;margin:auto;background:var(--bg);display:flex;flex-direction:column;position:relative}
main{flex:1}

.ambient{position:absolute;top:0;left:0;right:0;height:260px;transition:background .5s;
  background:radial-gradient(circle at 30% 0%,rgba(102,100,105,.1),transparent 60%);pointer-events:none}
.ambient.on{background:radial-gradient(circle at 30% 0%,rgba(201,162,76,.16),transparent 60%)}

.topRow{position:relative;padding:18px 20px 0}
.backLink{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:14.5px;font-weight:500}
.backLink svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.header{position:relative;padding:14px 20px 4px}
.hTitle{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}

.zone{position:relative;padding:20px 20px 0}

.mainCard{background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow-card)}
.mainTop{display:flex;align-items:center;gap:14px}
.bellWrap{flex:0 0 46px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:var(--surface);border:1px solid var(--line);transition:background .3s,border-color .3s}
.bellWrap.on{background:rgba(201,162,76,.14);border-color:rgba(201,162,76,.35)}
.bellWrap svg{width:20px;height:20px;stroke:var(--faint);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.bellWrap.on svg{stroke:var(--gold)}
.bellWrap.on svg{animation:ring 2.4s ease-in-out infinite}
@keyframes ring{0%,80%,100%{transform:rotate(0)}82%{transform:rotate(-12deg)}84%{transform:rotate(10deg)}86%{transform:rotate(-8deg)}88%{transform:rotate(4deg)}90%{transform:rotate(0)}}

.mainBody{flex:1}
.mainTitle{font-size:16px;font-weight:700;letter-spacing:-.01em}
.mainSub{margin-top:2px;font-size:12.5px;color:var(--muted)}

.toggle{flex:0 0 50px;width:50px;height:30px;border-radius:100px;background:var(--line);position:relative;
  transition:background .25s}
.toggle.on{background:linear-gradient(135deg,var(--gold),var(--gold2))}
.toggleKnob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.toggle.on .toggleKnob{transform:translateX(20px)}

.detailBody{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.2,.8,.2,1)}
.detailBody.open{max-height:900px}
.detailInner{padding-top:20px;margin-top:18px;border-top:1px solid var(--line)}

.subLabel{color:var(--faint);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px}

.timeRow{display:flex;align-items:center;justify-content:space-between}
.timeBig{font-size:30px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.timeChips{display:flex;gap:8px}
.timeChip{min-height:36px;padding:0 13px;border-radius:100px;background:var(--surface);border:1px solid var(--line);
  font-size:12.5px;font-weight:650;color:var(--muted);transition:border-color .15s,color .15s,background .15s}
.timeChip.active{border-color:var(--gold2);color:var(--gold-pale);background:rgba(201,162,76,.12)}

.daysZone{margin-top:22px}
.dayRow{display:flex;gap:7px}
.dayPill{flex:1;aspect-ratio:1;border-radius:50%;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);transition:all .15s}
.dayPill.active{background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:transparent;color:#1a1408}

.previewZone{margin-top:22px}
.notif{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;
  display:flex;gap:11px;align-items:flex-start}
.notifIcon{flex:0 0 30px;width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold2));
  display:grid;place-items:center;font-weight:800;font-size:13px;color:#1a1408}
.notifBody{flex:1;min-width:0}
.notifTop{display:flex;justify-content:space-between;align-items:baseline}
.notifApp{font-size:11.5px;font-weight:700;color:var(--muted)}
.notifTime{font-size:10.5px;color:var(--faint)}
.notifTitle{margin-top:2px;font-size:13.5px;font-weight:700}
.notifText{margin-top:1px;font-size:12.5px;color:var(--muted);line-height:1.4}

.secondaryCard{margin-top:14px;background:var(--surface2);border:1px solid var(--line);border-radius:18px;
  padding:16px 18px;box-shadow:var(--shadow-card);display:flex;align-items:center;gap:13px}
.secIconWrap{flex:0 0 38px;width:38px;height:38px;border-radius:11px;background:rgba(46,139,117,.14);
  display:grid;place-items:center;color:var(--green-pale)}
.secIconWrap svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.secBody{flex:1}
.secTitle{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.secSub{margin-top:2px;font-size:12px;color:var(--muted)}

.navBar{position:sticky;bottom:0;display:flex;border-top:1px solid var(--line);
  background:rgba(9,9,11,.92);backdrop-filter:blur(14px);padding:10px 6px calc(10px + env(safe-area-inset-bottom));margin-top:20px}
.navItem{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);
  font-size:10.5px;font-weight:600;padding:4px 0}
.navItem svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navItem.active{color:var(--gold)}
</style>
</head>
<body>
<div id="app">
  <div class="ambient" id="ambient"></div>

  <div class="topRow">
    <button class="backLink"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>Back to Profile</button>
  </div>

  <div class="header">
    <h1 class="hTitle">Reminders</h1>
  </div>

  <main class="zone">
    <div class="mainCard">
      <div class="mainTop">
        <span class="bellWrap" id="bellWrap">
          <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </span>
        <span class="mainBody">
          <div class="mainTitle">Daily reminders</div>
          <div class="mainSub" id="statusText">Reminders are off.</div>
        </span>
        <button class="toggle" id="toggle" aria-label="Toggle daily reminders"><span class="toggleKnob"></span></button>
      </div>

      <div class="detailBody" id="detailBody">
        <div class="detailInner">
          <div class="subLabel">Remind me at</div>
          <div class="timeRow">
            <span class="timeBig" id="timeBig">7:00 PM</span>
            <div class="timeChips" id="timeChips">
              <button class="timeChip" data-time="8:00 AM">Morning</button>
              <button class="timeChip active" data-time="7:00 PM">Evening</button>
              <button class="timeChip" data-time="9:30 PM">Night</button>
            </div>
          </div>

          <div class="daysZone">
            <div class="subLabel">Repeat on</div>
            <div class="dayRow" id="dayRow">
              <button class="dayPill active">S</button>
              <button class="dayPill active">M</button>
              <button class="dayPill active">T</button>
              <button class="dayPill active">W</button>
              <button class="dayPill active">T</button>
              <button class="dayPill active">F</button>
              <button class="dayPill active">S</button>
            </div>
          </div>

          <div class="previewZone">
            <div class="subLabel">Preview</div>
            <div class="notif">
              <span class="notifIcon">Lx</span>
              <span class="notifBody">
                <span class="notifTop"><span class="notifApp">Lexora</span><span class="notifTime" id="notifTime">7:00 PM</span></span>
                <div class="notifTitle">Your words are ready, Michael.</div>
                <div class="notifText">5 words &middot; about 10 minutes</div>
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="secondaryCard">
      <span class="secIconWrap"><svg viewBox="0 0 24 24"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-2-1-3-1-3 2 1 3 3 3 5a5 5 0 0 1-10 0c0-6 5-6 5-11z"/></svg></span>
      <span class="secBody">
        <div class="secTitle">Streak protection</div>
        <div class="secSub">One extra nudge if today's lesson is still undone by 8 PM</div>
      </span>
      <button class="toggle" id="toggle2" aria-label="Toggle streak protection"><span class="toggleKnob"></span></button>
    </div>
  </main>

  <nav class="navBar">
    <button class="navItem"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</button>
    <button class="navItem"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Learn</button>
    <button class="navItem"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 12V6"/><path d="M3 12h6"/></svg>Review</button>
    <button class="navItem"><svg viewBox="0 0 24 24"><path d="M5 20V11"/><path d="M12 20V4"/><path d="M19 20v-7"/></svg>Progress</button>
    <button class="navItem active"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Profile</button>
  </nav>
</div>

<script>
var toggle = document.getElementById('toggle');
var bellWrap = document.getElementById('bellWrap');
var statusText = document.getElementById('statusText');
var detailBody = document.getElementById('detailBody');
var ambient = document.getElementById('ambient');
var isOn = false;

toggle.addEventListener('click', function(){
  isOn = !isOn;
  toggle.classList.toggle('on', isOn);
  bellWrap.classList.toggle('on', isOn);
  detailBody.classList.toggle('open', isOn);
  ambient.classList.toggle('on', isOn);
  statusText.textContent = isOn ? 'On \u00b7 weekdays and weekends' : 'Reminders are off.';
});

var timeChips = document.querySelectorAll('.timeChip');
var timeBig = document.getElementById('timeBig');
var notifTime = document.getElementById('notifTime');
timeChips.forEach(function(chip){
  chip.addEventListener('click', function(){
    timeChips.forEach(function(c){ c.classList.remove('active'); });
    chip.classList.add('active');
    var t = chip.getAttribute('data-time');
    timeBig.textContent = t;
    notifTime.textContent = t;
  });
});

var dayPills = document.querySelectorAll('.dayPill');
dayPills.forEach(function(pill){
  pill.addEventListener('click', function(){
    pill.classList.toggle('active');
  });
});

var toggle2 = document.getElementById('toggle2');
toggle2.addEventListener('click', function(){
  toggle2.classList.toggle('on');
});

document.querySelectorAll(".navItem").forEach(function(btn){
  var routes = {Home:"home.html", Learn:"learn.html", Review:"review.html", Progress:"progress.html", Profile:"profile.html"};
  var label = btn.textContent.trim();
  if(routes[label]){
    btn.addEventListener("click", function(){ window.location.href = routes[label]; });
  }
});
</script>
</body>
</html>
