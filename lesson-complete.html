<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#09090b">
<title>Lexora: Lesson Complete</title>
<style>
:root{
  --bg:#09090b;
  --surface:#121216;
  --surface2:#17171c;
  --line:#25242a;
  --text:#f1eee7;
  --muted:#9a98a0;
  --faint:#626067;
  --gold:#c9a24c;
  --gold2:#a9874e;
  --gold-pale:#e8d9b5;
  --green:#2e8b75;
  --green-deep:#1f5c4e;
  --green-pale:#7fd6b8;
  --danger:#e06b76;
  --shadow-card:0 24px 50px -28px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.03);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100dvh;overflow-x:hidden}
button{font:inherit;cursor:pointer;touch-action:manipulation;background:none;border:0;color:inherit}
#app{min-height:100dvh;max-width:480px;margin:auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}

.ambient{position:absolute;top:0;left:0;right:0;height:340px;
  background:radial-gradient(circle at 50% 175px,rgba(201,162,76,.22),transparent 62%);pointer-events:none}

.doneMain{position:relative;flex:1;padding:46px 24px 8px;text-align:center;display:flex;flex-direction:column;align-items:center}

/* medallion + burst */
.medallionZone{position:relative;width:126px;height:126px;margin-bottom:26px}
.burst{position:absolute;inset:0}
.burst i{position:absolute;left:50%;top:50%;width:3px;height:3px;border-radius:50%;background:var(--gold);
  opacity:0;transform:translate(-50%,-50%);animation:burstOut 1s cubic-bezier(.15,.7,.3,1) .15s both}
@keyframes burstOut{
  0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--ang)) translateX(0) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--ang)) translateX(68px) scale(.3)}
}
.medalImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 14px 30px rgba(201,162,76,.45));
  animation:medallionIn .6s cubic-bezier(.16,1,.3,1) both}
.medalImg.imgFallback{background:var(--surface2);border:1px solid var(--line);border-radius:50%;
  filter:none;object-fit:none}
@keyframes medallionIn{from{opacity:0;transform:scale(.6) rotate(-16deg)}to{opacity:1;transform:scale(1) rotate(0)}}

.doneTitle{font-size:23px;line-height:1.2;font-weight:800;letter-spacing:-.015em;margin:0 0 12px;
  animation:riseIn .5s cubic-bezier(.2,.7,.2,1) .1s both}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.doneSub{color:var(--muted);font-size:15px;line-height:1.5;max-width:320px;
  animation:riseIn .5s cubic-bezier(.2,.7,.2,1) .16s both}

.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:22px;
  animation:riseIn .5s cubic-bezier(.2,.7,.2,1) .22s both}
.statCard{background:var(--surface2);border:1px solid var(--line);border-radius:18px;padding:20px 10px;
  display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:var(--shadow-card)}
.statCard.highlight{border-color:rgba(46,139,117,.35);background:linear-gradient(165deg,rgba(46,139,117,.12),var(--surface2))}
.statNum{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.statCard.highlight .statNum{color:var(--green-pale)}
.statLabel{font-size:10.5px;color:var(--faint);font-weight:650;letter-spacing:.03em}

.missedZone{width:100%;margin-top:14px;animation:riseIn .5s cubic-bezier(.2,.7,.2,1) .26s both}
.missedCard{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:var(--shadow-card);
  transition:border-color .15s,transform .12s}
.missedCard:active{transform:scale(.98);border-color:var(--gold2)}
.missedIcon{flex:0 0 30px;width:30px;height:30px;border-radius:9px;background:rgba(224,107,118,.12);
  color:var(--danger);display:grid;place-items:center}
.missedIcon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.missedText{flex:1}
.missedTitle{font-size:13.5px;font-weight:650;color:var(--text)}
.missedSub{font-size:11.5px;color:var(--faint);margin-top:1px}
.missedChevron{color:var(--faint);font-size:18px}

.ctaZone{width:100%;margin-top:26px;padding-bottom:calc(20px + env(safe-area-inset-bottom));
  animation:riseIn .5s cubic-bezier(.2,.7,.2,1) .3s both}
.homeBtn{width:100%;min-height:56px;border-radius:16px;font-size:16px;font-weight:700;letter-spacing:-.01em;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1408;
  box-shadow:0 10px 26px -10px rgba(201,162,76,.55);transition:transform .12s,filter .12s}
.homeBtn:active{transform:scale(.98);filter:brightness(.95)}

.navBar{position:sticky;bottom:0;display:flex;border-top:1px solid var(--line);
  background:rgba(9,9,11,.92);backdrop-filter:blur(14px);padding:10px 6px calc(10px + env(safe-area-inset-bottom))}
.navItem{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);
  font-size:10.5px;font-weight:600;padding:4px 0;transition:transform .12s}
.navItem:active{transform:scale(.92)}
.navItem svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navItem.active{color:var(--gold)}

@media(prefers-reduced-motion:reduce){
  .medalImg,.doneTitle,.doneSub,.statGrid,.missedZone,.ctaZone,.burst i{animation:none}
}
</style>
</head>
<body>
<div id="app">
  <div class="ambient"></div>

  <main class="doneMain">
    <div class="medallionZone">
      <div class="burst" id="burst"></div>
      <img class="medalImg" alt="Gold achievement medal with laurel wreath and checkmark" src="assets/illustrations/lesson-complete-medal.webp" onerror="this.classList.add('imgFallback');this.removeAttribute('src')">
    </div>

    <h1 class="doneTitle">Lesson complete, Michael.</h1>
    <p class="doneSub">4 of 5 today. One more look at<br>"Effective" and it's locked in.</p>

    <div class="statGrid">
      <div class="statCard">
        <span class="statNum" data-count="5">0</span>
        <span class="statLabel">Words</span>
      </div>
      <div class="statCard highlight">
        <span class="statNum" id="quizStat">0/5</span>
        <span class="statLabel">Quiz</span>
      </div>
      <div class="statCard">
        <span class="statNum" data-count="3">0</span>
        <span class="statLabel">Streak</span>
      </div>
      <div class="statCard">
        <span class="statNum" id="timeStat">0m</span>
        <span class="statLabel">Study</span>
      </div>
    </div>

    <div class="missedZone">
      <button class="missedCard" id="missedCard">
        <span class="missedIcon"><svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg></span>
        <span class="missedText">
          <span class="missedTitle">Review "Effective"</span>
          <span class="missedSub">The one word worth a second pass</span>
        </span>
        <span class="missedChevron">&rsaquo;</span>
      </button>
    </div>

    <div class="ctaZone">
      <button class="homeBtn" id="homeBtn">Return home</button>
    </div>
  </main>

  <nav class="navBar">
    <button class="navItem"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</button>
    <button class="navItem active"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Learn</button>
    <button class="navItem"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 12V6"/><path d="M3 12h6"/></svg>Review</button>
    <button class="navItem"><svg viewBox="0 0 24 24"><path d="M5 20V11"/><path d="M12 20V4"/><path d="M19 20v-7"/></svg>Progress</button>
    <button class="navItem"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Profile</button>
  </nav>
</div>

<script>
// radiating burst particles
var burst = document.getElementById('burst');
for(var i=0;i<14;i++){
  var p = document.createElement('i');
  p.style.setProperty('--ang', (i * (360/14)) + 'deg');
  p.style.animationDelay = (0.15 + Math.random()*0.1) + 's';
  burst.appendChild(p);
}

// count-up numbers
function countUp(el, target, suffix, duration){
  suffix = suffix || '';
  duration = duration || 700;
  var start = null;
  function step(ts){
    if(!start) start = ts;
    var progress = Math.min((ts - start) / duration, 1);
    var eased = 1 - Math.pow(1 - progress, 3);
    el.textContent = Math.round(eased * target) + suffix;
    if(progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

document.querySelectorAll('[data-count]').forEach(function(el){
  countUp(el, parseInt(el.getAttribute('data-count'), 10), '', 800);
});

setTimeout(function(){
  var q = document.getElementById('quizStat');
  var t = document.getElementById('timeStat');
  var qv = 0;
  var qi = setInterval(function(){
    qv++;
    q.textContent = qv + '/5';
    if(qv >= 4) clearInterval(qi);
  }, 140);
  countUp(t, 10, 'm', 800);
}, 100);

document.getElementById('homeBtn').addEventListener('click', function(){
  window.location.href = 'home.html';
});

// Provisional route: passes the missed word as a query param so word-detail
// can load it directly once real state is threaded through the app.
document.getElementById('missedCard').addEventListener('click', function(){
  window.location.href = 'word-detail.html?word=Effective';
});

document.querySelectorAll(".navItem").forEach(function(btn){
  var routes = {Home:"home.html", Learn:"learn.html", Review:"review.html", Progress:"progress.html", Profile:"profile.html"};
  var label = btn.textContent.trim();
  if(routes[label]){
    btn.addEventListener("click", function(){ window.location.href = routes[label]; });
  }
});
</script>
</body>
</html>
