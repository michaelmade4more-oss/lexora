<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>Lexora — Hear and match</title>
<style>
:root{--bg:#09090b;--surface:#121216;--surface2:#17171c;--line:#25242a;--text:#f1eee7;--muted:#9a98a0;--gold:#c9a24c;--gold2:#a9874e;--gold-pale:#e8d9b5;--green:#2e8b75;--danger:#e06b76;--ease:cubic-bezier(.2,.8,.2,1)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"SF Pro Text",Inter,-apple-system,BlinkMacSystemFont,sans-serif}body{min-height:100dvh}.engine-room{max-width:480px;min-height:100dvh;margin:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative;overflow:hidden}.engine-top{display:flex;justify-content:space-between;align-items:center}.engine-back,.engine-mute{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:var(--surface2);color:var(--muted);font-size:24px}.engine-step{font-size:11px;color:var(--muted);font-weight:700}.engine-progress{height:9px;margin-top:17px;border-radius:99px;background:repeating-linear-gradient(90deg,var(--line) 0,var(--line) calc(12.5% - 3px),var(--bg) calc(12.5% - 3px),var(--bg) 12.5%);overflow:hidden}.engine-progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold-pale),var(--gold));box-shadow:0 0 14px rgba(201,162,76,.75);transition:width .55s var(--ease)}.engine-scene{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:34px}.engine-kicker{color:var(--gold);font-size:10px;font-weight:750;letter-spacing:.15em;text-transform:uppercase}.engine-scene h1{margin:10px 0 0;font-family:"SF Pro Display",Inter,-apple-system,BlinkMacSystemFont,sans-serif;font-size:34px;letter-spacing:-.055em;text-align:center}.engine-instruction{max-width:290px;color:var(--muted);font-size:14px;line-height:1.45;text-align:center}.engine-guide{width:150px;height:150px;margin:28px 0 18px;border-radius:50%;display:grid;place-items:center;position:relative;background:rgba(201,162,76,.11);border:1px solid rgba(201,162,76,.28);font-size:58px;animation:float 3s ease-in-out infinite}.engine-guide span{position:absolute;right:3px;top:7px;color:var(--gold-pale);font-size:24px;animation:twinkle 1.5s infinite}@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}@keyframes twinkle{50%{transform:scale(1.2);opacity:.55}}.engine-word-card{padding:11px 22px;border:1px solid rgba(201,162,76,.28);border-radius:99px;background:rgba(201,162,76,.08);text-align:center}.engine-word-card strong{font-size:23px}.engine-word-card span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.engine-listen{width:74px;height:74px;margin-top:22px;border-radius:50%;background:var(--gold);color:#1a1408;font-size:30px;border:0}.engine-listen.playing{animation:pulse 1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(201,162,76,.12)}}.engine-audio-label{height:22px;margin-top:8px;color:var(--gold-pale);font-size:12px}.engine-choices{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:16px}.engine-choice{min-height:120px;border:1px solid var(--line);border-radius:21px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:48px;color:var(--text);transition:transform .18s ease,box-shadow .18s ease}.engine-choice:active{transform:scale(.95)}.engine-choice.correct{background:rgba(46,139,117,.2);border-color:var(--green);animation:correct .45s ease}.engine-choice.wrong{background:rgba(224,107,118,.12);border-color:var(--danger);animation:shake .35s ease}@keyframes correct{50%{transform:scale(1.08)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.engine-choice-label{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%)}.engine-choice-prompt,.engine-feedback{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}.engine-feedback.success{color:var(--green)}.engine-feedback.retry-state{color:var(--danger)}.engine-retry,.engine-continue{width:100%;min-height:50px;margin-top:9px;border:0;border-radius:15px;font-weight:750}.engine-retry{background:var(--surface2);color:var(--muted)}.engine-continue{background:var(--green);color:#eafff8}.engine-retry.attention{animation:nudge .7s 3}.engine-continue.attention{animation:glow 1.1s 4;box-shadow:0 0 0 5px rgba(46,139,117,.22),0 0 30px rgba(46,139,117,.78)}@keyframes nudge{35%{transform:translateX(-4px)}65%{transform:translateX(4px)}}@keyframes glow{50%{transform:translateY(-4px) scale(1.025);box-shadow:0 0 0 14px rgba(46,139,117,.12),0 0 36px rgba(46,139,117,.9)}}.engine-complete{position:absolute;inset:0;z-index:4;background:rgba(9,9,11,.95);display:grid;place-items:center;text-align:center;opacity:0;visibility:hidden;transition:.3s}.engine-complete.open{opacity:1;visibility:visible}.engine-check{width:100px;height:100px;margin:auto;border-radius:42% 58% 54% 46%;display:grid;place-items:center;background:linear-gradient(145deg,var(--green),#1f5c4e);font-size:52px}.engine-complete h2{max-width:280px;margin:20px auto;font-size:28px}.engine-finish{min-height:52px;width:280px;border-radius:15px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1408;font-weight:750}.hidden{display:none!important}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body><div id="lessonRoot"></div>
<script src="lexora-progress.js"></script><script src="engine/curriculum-engine.js"></script><script>
LexoraCurriculumEngine.mount({root:'#lessonRoot',specUrl:'lessons/engine/early-lesson-14.spec.json'});
</script>
</body></html>
