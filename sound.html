<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#09090b">
<title>Lexora: Sound</title>
<style>
:root{
  --bg:#09090b;
  --surface:#121216;
  --surface2:#17171c;
  --line:#25242a;
  --text:#f1eee7;
  --muted:#9a98a0;
  --faint:#626067;
  --gold:#c9a24c;
  --gold2:#a9874e;
  --gold-pale:#e8d9b5;
  --shadow-card:0 24px 50px -28px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.03);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100dvh;overflow-x:hidden}
button{font:inherit;cursor:pointer;touch-action:manipulation;background:none;border:0;color:inherit}
#app{min-height:100dvh;max-width:480px;margin:auto;background:var(--bg);display:flex;flex-direction:column;position:relative}
main{flex:1}

.ambient{position:absolute;top:0;left:0;right:0;height:260px;transition:background .5s;
  background:radial-gradient(circle at 30% 0%,rgba(201,162,76,.16),transparent 60%);pointer-events:none}
.ambient.off{background:radial-gradient(circle at 30% 0%,rgba(102,100,105,.1),transparent 60%)}

.topRow{position:relative;padding:18px 20px 0}
.backLink{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:14.5px;font-weight:500}
.backLink svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.header{position:relative;padding:14px 20px 4px}
.hTitle{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}

.zone{position:relative;padding:20px 20px 0}

.mainCard{background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow-card)}
.mainTop{display:flex;align-items:center;gap:14px}
.iconWrap{flex:0 0 46px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:rgba(201,162,76,.14);border:1px solid rgba(201,162,76,.35);transition:background .3s,border-color .3s}
.iconWrap.off{background:var(--surface);border-color:var(--line)}
.iconWrap svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.iconWrap.off svg{stroke:var(--faint)}
.waveBars{position:absolute;right:-3px;bottom:-3px;display:flex;align-items:flex-end;gap:1.5px;height:11px;
  background:var(--surface2);border-radius:4px;padding:1px 2px}
.waveBars span{width:2px;border-radius:1px;background:var(--gold);height:3px}
.iconWrap.on .waveBars span{animation:wbar 1s ease-in-out infinite}
.iconWrap.on .waveBars span:nth-child(1){animation-delay:0s}
.iconWrap.on .waveBars span:nth-child(2){animation-delay:.15s}
.iconWrap.on .waveBars span:nth-child(3){animation-delay:.3s}
@keyframes wbar{0%,100%{height:3px}50%{height:9px}}

.mainBody{flex:1}
.mainTitle{font-size:16px;font-weight:700;letter-spacing:-.01em}
.mainSub{margin-top:2px;font-size:12.5px;color:var(--muted)}

.toggle{flex:0 0 50px;width:50px;height:30px;border-radius:100px;background:var(--line);position:relative;transition:background .25s}
.toggle.on{background:linear-gradient(135deg,var(--gold),var(--gold2))}
.toggleKnob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.toggle.on .toggleKnob{transform:translateX(20px)}

.detailBody{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.2,.8,.2,1)}
.detailBody.open{max-height:900px}
.detailInner{padding-top:18px;margin-top:18px;border-top:1px solid var(--line)}

.subLabel{color:var(--faint);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 4px}
.infoText{font-size:12.5px;line-height:1.55;color:var(--muted);margin:0 0 18px}

.volRow{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.volTrack{flex:1;height:5px;border-radius:3px;background:var(--line);position:relative}
.volFill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold2),var(--gold));width:70%}
.volKnob{position:absolute;top:50%;left:70%;width:16px;height:16px;border-radius:50%;background:var(--gold-pale);
  transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.volIcon{color:var(--faint);flex:0 0 16px}
.volIcon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.soundList{display:flex;flex-direction:column;gap:2px}
.soundRow{display:flex;align-items:center;gap:12px;padding:11px 2px}
.soundRow+.soundRow{border-top:1px solid var(--line)}
.playBtn{flex:0 0 34px;width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;transition:border-color .2s}
.playBtn.playing{border-color:var(--gold2)}
.playBars{display:flex;align-items:center;gap:2px;height:13px}
.playBars span{width:2.2px;border-radius:1px;background:var(--gold);height:4px}
.playBtn.playing .playBars span{animation:pbar .7s ease-in-out infinite}
.playBtn.playing .playBars span:nth-child(1){animation-delay:0s}
.playBtn.playing .playBars span:nth-child(2){animation-delay:.1s}
.playBtn.playing .playBars span:nth-child(3){animation-delay:.2s}
.playBtn.playing .playBars span:nth-child(4){animation-delay:.15s}
@keyframes pbar{0%,100%{height:4px}50%{height:12px}}
.soundInfo{flex:1}
.soundTitle{font-size:14px;font-weight:650}
.soundSub{font-size:11.5px;color:var(--faint);margin-top:1px}
.miniToggle{flex:0 0 40px;width:40px;height:24px;border-radius:100px;background:var(--line);position:relative;transition:background .2s}
.miniToggle.on{background:linear-gradient(135deg,var(--gold),var(--gold2))}
.miniKnob{position:absolute;top:2.5px;left:2.5px;width:19px;height:19px;border-radius:50%;background:#fff;
  transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.miniToggle.on .miniKnob{transform:translateX(16px)}

.navBar{position:sticky;bottom:0;display:flex;border-top:1px solid var(--line);
  background:rgba(9,9,11,.92);backdrop-filter:blur(14px);padding:10px 6px calc(10px + env(safe-area-inset-bottom));margin-top:20px}
.navItem{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);
  font-size:10.5px;font-weight:600;padding:4px 0}
.navItem svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navItem.active{color:var(--gold)}
</style>
</head>
<body>
<div id="app">
  <div class="ambient" id="ambient"></div>

  <div class="topRow">
    <button class="backLink"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>Back to Profile</button>
  </div>

  <div class="header">
    <h1 class="hTitle">Sound</h1>
  </div>

  <main class="zone">
    <div class="mainCard">
      <div class="mainTop">
        <span class="iconWrap on" id="iconWrap">
          <svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
          <span class="waveBars"><span></span><span></span><span></span></span>
        </span>
        <span class="mainBody">
          <div class="mainTitle">Learning sounds</div>
          <div class="mainSub" id="statusText">Sound feedback is on.</div>
        </span>
        <button class="toggle on" id="toggle" aria-label="Toggle learning sounds"><span class="toggleKnob"></span></button>
      </div>

      <div class="detailBody open" id="detailBody">
        <div class="detailInner">
          <p class="infoText">Subtle sounds confirm answers, saving and lesson completion. Word pronunciation remains available through Listen.</p>

          <div class="subLabel">Volume</div>
          <div class="volRow">
            <span class="volIcon"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4V5z"/></svg></span>
            <div class="volTrack"><div class="volFill"></div><div class="volKnob"></div></div>
            <span class="volIcon"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></span>
          </div>

          <div class="subLabel">Sound types</div>
          <div class="soundList" id="soundList"></div>
        </div>
      </div>
    </div>
  </main>

  <nav class="navBar">
    <button class="navItem"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</button>
    <button class="navItem"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Learn</button>
    <button class="navItem"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 12V6"/><path d="M3 12h6"/></svg>Review</button>
    <button class="navItem"><svg viewBox="0 0 24 24"><path d="M5 20V11"/><path d="M12 20V4"/><path d="M19 20v-7"/></svg>Progress</button>
    <button class="navItem active"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Profile</button>
  </nav>
</div>

<script>
var toggle = document.getElementById('toggle');
var iconWrap = document.getElementById('iconWrap');
var statusText = document.getElementById('statusText');
var detailBody = document.getElementById('detailBody');
var ambient = document.getElementById('ambient');
var isOn = true;

toggle.addEventListener('click', function(){
  isOn = !isOn;
  toggle.classList.toggle('on', isOn);
  iconWrap.classList.toggle('on', isOn);
  iconWrap.classList.toggle('off', !isOn);
  detailBody.classList.toggle('open', isOn);
  ambient.classList.toggle('off', !isOn);
  statusText.textContent = isOn ? 'Sound feedback is on.' : 'Sound feedback is off.';
});

var sounds = [
  {name:'Correct answer', sub:'Plays during quiz and review'},
  {name:'Incorrect answer', sub:'A soft, non-jarring cue'},
  {name:'Lesson complete', sub:'Plays on the finish screen'},
  {name:'Save & bookmark', sub:'Confirms saving a word'}
];

var list = document.getElementById('soundList');
sounds.forEach(function(s, i){
  var row = document.createElement('div');
  row.className = 'soundRow';
  row.innerHTML =
    '<button class="playBtn"><span class="playBars"><span></span><span></span><span></span><span></span></span></button>' +
    '<span class="soundInfo"><div class="soundTitle">' + s.name + '</div><div class="soundSub">' + s.sub + '</div></span>' +
    '<button class="miniToggle on"><span class="miniKnob"></span></button>';

  row.querySelector('.playBtn').addEventListener('click', function(){
    this.classList.add('playing');
    var el = this;
    setTimeout(function(){ el.classList.remove('playing'); }, 700);
  });
  row.querySelector('.miniToggle').addEventListener('click', function(){
    this.classList.toggle('on');
  });

  list.appendChild(row);
});

document.querySelectorAll(".navItem").forEach(function(btn){
  var routes = {Home:"home.html", Learn:"learn.html", Review:"review.html", Progress:"progress.html", Profile:"profile.html"};
  var label = btn.textContent.trim();
  if(routes[label]){
    btn.addEventListener("click", function(){ window.location.href = routes[label]; });
  }
});
</script>
</body>
</html>
