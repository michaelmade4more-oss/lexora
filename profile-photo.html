<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#09090b">
<title>Lexora: Profile Photo</title>
<style>
:root{
  --bg:#09090b;
  --surface:#121216;
  --surface2:#17171c;
  --line:#25242a;
  --text:#f1eee7;
  --muted:#9a98a0;
  --faint:#626067;
  --gold:#c9a24c;
  --gold2:#a9874e;
  --danger:#e06b76;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100dvh;overflow-x:hidden}
button{font:inherit;cursor:pointer;touch-action:manipulation;background:none;border:0;color:inherit}
#app{min-height:100dvh;max-width:480px;margin:auto;background:var(--bg);display:flex;flex-direction:column;position:relative}

.backLink{display:inline-flex;align-items:center;gap:4px;padding:18px 20px 0;color:var(--muted);
  font-size:14.5px;font-weight:500;align-self:flex-start;transition:opacity .15s}
.backLink:active{opacity:.6}
.backLink svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.pageMain{flex:1;padding:8px 20px 32px}
.pageTitle{font-size:26px;line-height:1.15;font-weight:700;
  letter-spacing:-.02em;margin:16px 0 22px;
  animation:riseIn .5s cubic-bezier(.2,.7,.2,1) both}

.card{background:var(--surface2);border:1px solid var(--line);border-radius:24px;padding:34px 24px 24px;text-align:center;
  animation:riseIn .5s cubic-bezier(.2,.7,.2,1) .08s both}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.avatarZone{position:relative;width:148px;height:148px;margin:0 auto}
.avatarRing{width:148px;height:148px;border-radius:50%;padding:4px;background:var(--gold);cursor:pointer}
.avatarRingInner{width:100%;height:100%;border-radius:50%;background:var(--surface2);padding:3px}
.avatar{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover}
.avatarInitial{display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--line),var(--bg));
  color:var(--gold);font-size:46px;line-height:1;font-weight:650;letter-spacing:-.02em}
.streakBadge{position:absolute;right:-2px;bottom:-2px;min-width:30px;height:30px;padding:0 7px;border-radius:15px;
  background:var(--bg);border:1.5px solid var(--gold);display:flex;align-items:center;gap:3px;justify-content:center;
  box-shadow:0 4px 10px rgba(0,0,0,.5)}
.streakBadge svg{width:11px;height:11px;fill:var(--gold);stroke:none}
.streakBadge span{color:var(--gold);font-size:11.5px;font-weight:700}
input[type="file"]{display:none}

.eyebrow{margin-top:22px;color:var(--gold);font-weight:700;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.identName{font-size:24px;line-height:1.15;font-weight:650;letter-spacing:-.02em;margin-top:8px}
.identRole{margin-top:4px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}

.divider{height:1px;background:var(--line);margin:22px 0 16px}
.metaRow{color:var(--faint);font-size:11.5px}

.btnRow{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;min-height:52px;border-radius:14px;font-size:15px;font-weight:650;letter-spacing:-.01em;
  display:flex;align-items:center;justify-content:center;transition:transform .12s,filter .12s}
.btnPrimary{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1408}
.btnPrimary:active{transform:scale(.97);filter:brightness(.94)}
.btnSecondary{background:var(--surface);border:1px solid var(--line);color:var(--text)}
.btnSecondary:active{transform:scale(.97);background:var(--surface2)}

.navBar{position:sticky;bottom:0;display:flex;border-top:1px solid var(--line);
  background:rgba(9,9,11,.92);backdrop-filter:blur(14px);padding:10px 6px calc(10px + env(safe-area-inset-bottom))}
.navItem{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);
  font-size:10.5px;font-weight:600;padding:4px 0;transition:transform .12s}
.navItem:active{transform:scale(.92)}
.navItem svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navItem.active{color:var(--gold)}

/* Reposition sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:auto;background:var(--surface2);
  border:1px solid var(--line);border-bottom:none;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:11}
.sheet.open{transform:translateY(0)}
.sheetHandle{width:36px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 16px}
.sheetTitle{font-size:17px;font-weight:700;text-align:center}
.sheetSub{margin-top:4px;text-align:center;color:var(--muted);font-size:12.5px}
.cropStage{width:260px;height:260px;margin:20px auto 6px;border-radius:50%;overflow:hidden;position:relative;
  background:var(--bg);touch-action:none;cursor:grab;border:1px solid var(--line)}
.cropStage:active{cursor:grabbing}
.cropStage img{position:absolute;top:50%;left:50%;transform-origin:center center;will-change:transform;user-select:none;pointer-events:none}
.zoomRow{display:flex;align-items:center;gap:10px;margin-top:18px}
.zoomRow svg{width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:2;flex:0 0 auto}
.zoomRow svg:last-child{width:19px;height:19px}
input[type="range"]{-webkit-appearance:none;flex:1;height:3px;border-radius:2px;background:var(--line);outline:none}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--gold);border:2px solid #1a1408;cursor:pointer}

@media(prefers-reduced-motion:reduce){
  .pageTitle,.card{animation:none}
  .backdrop,.sheet,.btn,.navItem{transition:none}
}
@media(max-height:740px){
  .avatarZone,.avatarRing{width:120px;height:120px}
  .card{padding:26px 20px 20px}
  .pageTitle{font-size:28px;margin-bottom:16px}
}
</style>
</head>
<body>
<div id="app">

  <button class="backLink" onclick="history.back()">
    <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
    Back to Profile
  </button>

  <main class="pageMain">
    <h1 class="pageTitle">Profile Photo</h1>

    <div class="card">
      <div class="avatarZone">
        <button class="avatarRing" id="ringBtn" aria-label="Change profile photo">
          <div class="avatarRingInner">
            <img id="avatarImg" class="avatar" style="display:none" alt="Profile photo">
            <div id="avatarInitial" class="avatar avatarInitial">M</div>
          </div>
        </button>
        <div class="streakBadge">
          <svg viewBox="0 0 24 24"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-2-1-3-1-3 2 1 3 3 3 5a5 5 0 0 1-10 0c0-6 5-6 5-11z"/></svg>
          <span>7</span>
        </div>
      </div>

      <div class="eyebrow">Lexora identity</div>
      <div class="identName">Michael</div>
      <div class="identRole">Lexora Learner</div>

      <div class="divider"></div>
      <div class="metaRow">Default profile identity &bull; Stored on this device</div>

      <div class="btnRow">
        <button class="btn btnPrimary" id="addBtn">Add photo</button>
        <input type="file" id="photoInput" accept="image/*">
        <button class="btn btnSecondary" onclick="history.back()">Done</button>
      </div>
    </div>
  </main>

  <nav class="navBar">
    <button class="navItem"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</button>
    <button class="navItem"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Learn</button>
    <button class="navItem"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 12V6"/><path d="M3 12h6"/></svg>Review</button>
    <button class="navItem"><svg viewBox="0 0 24 24"><path d="M5 20V11"/><path d="M12 20V4"/><path d="M19 20v-7"/></svg>Progress</button>
    <button class="navItem active"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Profile</button>
  </nav>

  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="sheetHandle"></div>
    <div class="sheetTitle">Adjust photo</div>
    <div class="sheetSub">Drag to reposition. Use the slider to zoom.</div>
    <div class="cropStage" id="cropStage">
      <img id="cropImg" alt="">
    </div>
    <div class="zoomRow">
      <svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
      <input type="range" id="zoomSlider" min="1" max="2.5" step="0.01" value="1">
      <svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="M21 21l-4.3-4.3"/><path d="M7 10h6"/><path d="M10 7v6"/></svg>
    </div>
    <div class="btnRow">
      <button class="btn btnSecondary" id="cancelBtn">Cancel</button>
      <button class="btn btnPrimary" id="saveBtn">Save</button>
    </div>
  </div>

</div>
<script>
var D = 260;
var sourceImg = null;
var state = {tx:0, ty:0, scale:1};
var addBtn = document.getElementById('addBtn');
var ringBtn = document.getElementById('ringBtn');
var photoInput = document.getElementById('photoInput');
var avatarImg = document.getElementById('avatarImg');
var avatarInitial = document.getElementById('avatarInitial');
var backdrop = document.getElementById('backdrop');
var sheet = document.getElementById('sheet');
var cropStage = document.getElementById('cropStage');
var cropImg = document.getElementById('cropImg');
var zoomSlider = document.getElementById('zoomSlider');

function openPicker(){ photoInput.click(); }
addBtn.addEventListener('click', function(){
  if(avatarImg.style.display === 'block'){ openSheetForEdit(); } else { openPicker(); }
});
ringBtn.addEventListener('click', function(){
  if(sourceImg){ openSheetForEdit(); } else { openPicker(); }
});

photoInput.addEventListener('change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      sourceImg = img;
      state = {tx:0, ty:0, scale:1};
      openSheet();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function baseScale(){
  return D / Math.min(sourceImg.naturalWidth, sourceImg.naturalHeight);
}
function totalScale(){
  return baseScale() * state.scale;
}
function clampState(){
  var ts = totalScale();
  var overX = Math.max(0, (sourceImg.naturalWidth*ts - D)/2);
  var overY = Math.max(0, (sourceImg.naturalHeight*ts - D)/2);
  state.tx = Math.max(-overX, Math.min(overX, state.tx));
  state.ty = Math.max(-overY, Math.min(overY, state.ty));
}
function renderCrop(){
  clampState();
  var ts = totalScale();
  cropImg.style.width = (sourceImg.naturalWidth*ts) + 'px';
  cropImg.style.height = (sourceImg.naturalHeight*ts) + 'px';
  cropImg.style.transform = 'translate(-50%,-50%) translate(' + state.tx + 'px,' + state.ty + 'px)';
}

function openSheet(){
  cropImg.src = sourceImg.src;
  zoomSlider.value = state.scale;
  renderCrop();
  backdrop.classList.add('open');
  sheet.classList.add('open');
}
function openSheetForEdit(){ openSheet(); }
function closeSheet(){
  backdrop.classList.remove('open');
  sheet.classList.remove('open');
  photoInput.value = '';
}

document.getElementById('cancelBtn').addEventListener('click', closeSheet);
backdrop.addEventListener('click', closeSheet);

zoomSlider.addEventListener('input', function(){
  state.scale = parseFloat(zoomSlider.value);
  renderCrop();
});

var dragging = false, startX=0, startY=0, originTx=0, originTy=0;
cropStage.addEventListener('pointerdown', function(e){
  dragging = true;
  startX = e.clientX; startY = e.clientY;
  originTx = state.tx; originTy = state.ty;
  cropStage.setPointerCapture(e.pointerId);
});
cropStage.addEventListener('pointermove', function(e){
  if(!dragging) return;
  state.tx = originTx + (e.clientX - startX);
  state.ty = originTy + (e.clientY - startY);
  renderCrop();
});
cropStage.addEventListener('pointerup', function(){ dragging = false; });
cropStage.addEventListener('pointercancel', function(){ dragging = false; });

document.getElementById('saveBtn').addEventListener('click', function(){
  var C = 480;
  var canvas = document.createElement('canvas');
  canvas.width = C; canvas.height = C;
  var ctx = canvas.getContext('2d');
  var canvasScale = C / D;
  var ts = totalScale();
  ctx.save();
  ctx.beginPath();
  ctx.arc(C/2, C/2, C/2, 0, Math.PI*2);
  ctx.clip();
  ctx.translate(C/2 + state.tx*canvasScale, C/2 + state.ty*canvasScale);
  ctx.scale(ts*canvasScale, ts*canvasScale);
  ctx.drawImage(sourceImg, -sourceImg.naturalWidth/2, -sourceImg.naturalHeight/2);
  ctx.restore();
  var dataUrl = canvas.toDataURL('image/png');
  avatarImg.src = dataUrl;
  avatarImg.style.display = 'block';
  avatarInitial.style.display = 'none';
  addBtn.textContent = 'Change photo';
  closeSheet();
});

document.querySelectorAll(".navItem").forEach(function(btn){
  var routes = {Home:"home.html", Learn:"learn.html", Review:"review.html", Progress:"progress.html", Profile:"profile.html"};
  var label = btn.textContent.trim();
  if(routes[label]){
    btn.addEventListener("click", function(){ window.location.href = routes[label]; });
  }
});
</script>
</body>
</html>
